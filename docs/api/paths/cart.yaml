cart:
  get:
    tags:
      - Cart

    summary: View the cart

    description: |
      Returns the current customer's cart with its lines, their options and the subtotal. A customer
      has at most one cart and all of its items come from the same restaurant; `cart` is `null` when
      there is none. Lines whose menu item is no longer available are flagged with `isAvailable:
      false`.

    operationId: getCart

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Cart retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/cart.yaml#/GetCartResponse"
            example:
              success: true
              message: Cart retrieved successfully
              data:
                cart:
                  id: 84c74967-41e7-5a32-a5ed-9506bf92a459
                  restaurant:
                    id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                    name: Nile Grill House
                  items:
                    - id: 502199a9-304a-553b-ad69-1bf2baa4391e
                      menuItemId: 31e9dc29-fd80-5f86-8c09-06b6ee1ef963
                      name: Mixed Grill
                      imageUrl: https://cdn.example.com/menu/mixed-grill.jpg
                      quantity: 2
                      unitPrice: 170
                      totalPrice: 340
                      specialInstructions: No onions
                      options:
                        - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                          optionGroupName: Size
                          optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb
                          optionValueName: Large
                          priceAdjustment: 20
                      isAvailable: true
                  itemCount: 2
                  subtotal: 340
                  updatedAt: "2024-10-05T18:20:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  delete:
    tags:
      - Cart

    summary: Clear the cart

    description: Deletes the cart with all its lines and their options.

    operationId: clearCart

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Cart cleared
        content:
          application/json:
            schema:
              $ref: "../schemas/cart.yaml#/ClearCartResponse"
            example:
              success: true
              message: Cart cleared
              data: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

cartItems:
  post:
    tags:
      - Cart

    summary: Add an item to the cart

    description: |
      Adds a menu item to the cart together with the options and note the customer chose. Only active, available items of an approved restaurant can be added (`404` or `409` otherwise). Each option must belong to the menu item, and every option group's rules must be met: the number of chosen options must be between the group's minimum and maximum, and a required group needs a choice (`400` otherwise).

      The line's unit price is the item's base price plus the price adjustment of every chosen option. If the cart already has a line with the same item, the same options and the same note, that line's quantity goes up; otherwise a new line is added, so a Large and a Regular of the same item sit on separate lines.

      A cart holds one restaurant's items. If the cart already contains another restaurant's items the call is rejected with `409` unless `replaceCart` is `true`, which discards the old cart and starts a new one.

    operationId: addCartItem

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/cart.yaml#/AddCartItemRequest"
          examples:
            valid:
              summary: Valid request
              value:
                menuItemId: 31e9dc29-fd80-5f86-8c09-06b6ee1ef963
                quantity: 2
                specialInstructions: No onions
                options:
                  - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                    optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb
            missingMenuItemId:
              summary: Missing required `menuItemId` (400)
              value:
                quantity: 2
                specialInstructions: No onions
                options:
                  - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                    optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb
            invalidMenuItemId:
              summary: "`menuItemId` is not a valid UUID (400)"
              value:
                menuItemId: not-a-uuid
                quantity: 2
                specialInstructions: No onions
                options:
                  - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                    optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb
            quantityTooLow:
              summary: "`quantity` below the minimum of 1 (400)"
              value:
                menuItemId: 31e9dc29-fd80-5f86-8c09-06b6ee1ef963
                quantity: 0
                specialInstructions: No onions
                options:
                  - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                    optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb

    responses:
      "201":
        description: Item added to cart
        content:
          application/json:
            schema:
              $ref: "../schemas/cart.yaml#/AddCartItemResponse"
            example:
              success: true
              message: Item added to cart
              data:
                cart:
                  id: 84c74967-41e7-5a32-a5ed-9506bf92a459
                  restaurant:
                    id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                    name: Nile Grill House
                  items:
                    - id: 502199a9-304a-553b-ad69-1bf2baa4391e
                      menuItemId: 31e9dc29-fd80-5f86-8c09-06b6ee1ef963
                      name: Mixed Grill
                      imageUrl: https://cdn.example.com/menu/mixed-grill.jpg
                      quantity: 2
                      unitPrice: 170
                      totalPrice: 340
                      specialInstructions: No onions
                      options:
                        - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                          optionGroupName: Size
                          optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb
                          optionValueName: Large
                          priceAdjustment: 20
                      isAvailable: true
                  itemCount: 2
                  subtotal: 340
                  updatedAt: "2024-10-05T18:20:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

cartItem:
  parameters:
    - name: itemId
      in: path
      required: true
      description: Unique identifier of the cart line.
      schema:
        type: string
        format: uuid
      example: 502199a9-304a-553b-ad69-1bf2baa4391e

  patch:
    tags:
      - Cart

    summary: Change a cart line

    description: |
      Changes the quantity, the note or the options of one cart line. Only the supplied fields change;
      `options`, when sent, replaces the line's whole set of options and the unit price is
      recalculated. Each option must belong to the menu item, and every option group's rules must be
      met: the number of chosen options must be between the group's minimum and maximum, and a
      required group needs a choice (`400` otherwise).

    operationId: updateCartItem

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/cart.yaml#/UpdateCartItemRequest"
          examples:
            valid:
              summary: Valid request
              value:
                quantity: 3
            emptyBody:
              summary: Empty body (400)
              value: {}
            quantityTooLow:
              summary: "`quantity` below the minimum of 1 (400)"
              value:
                quantity: 0

    responses:
      "200":
        description: Cart item updated
        content:
          application/json:
            schema:
              $ref: "../schemas/cart.yaml#/UpdateCartItemResponse"
            example:
              success: true
              message: Cart item updated
              data:
                cart:
                  id: 84c74967-41e7-5a32-a5ed-9506bf92a459
                  restaurant:
                    id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                    name: Nile Grill House
                  items:
                    - id: 502199a9-304a-553b-ad69-1bf2baa4391e
                      menuItemId: 31e9dc29-fd80-5f86-8c09-06b6ee1ef963
                      name: Mixed Grill
                      imageUrl: https://cdn.example.com/menu/mixed-grill.jpg
                      quantity: 3
                      unitPrice: 170
                      totalPrice: 510
                      specialInstructions: No onions
                      options:
                        - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                          optionGroupName: Size
                          optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb
                          optionValueName: Large
                          priceAdjustment: 20
                      isAvailable: true
                  itemCount: 3
                  subtotal: 510
                  updatedAt: "2024-10-05T18:20:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  delete:
    tags:
      - Cart

    summary: Remove a line from the cart

    description: Removes one line with its options. Removing the last line deletes the cart.

    operationId: removeCartItem

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Item removed from cart
        content:
          application/json:
            schema:
              $ref: "../schemas/cart.yaml#/RemoveCartItemResponse"
            example:
              success: true
              message: Item removed from cart
              data:
                cart:
                  id: 84c74967-41e7-5a32-a5ed-9506bf92a459
                  restaurant:
                    id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                    name: Nile Grill House
                  items:
                    - id: 502199a9-304a-553b-ad69-1bf2baa4391e
                      menuItemId: 31e9dc29-fd80-5f86-8c09-06b6ee1ef963
                      name: Mixed Grill
                      imageUrl: https://cdn.example.com/menu/mixed-grill.jpg
                      quantity: 1
                      unitPrice: 170
                      totalPrice: 170
                      specialInstructions: No onions
                      options:
                        - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                          optionGroupName: Size
                          optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb
                          optionValueName: Large
                          priceAdjustment: 20
                      isAvailable: true
                  itemCount: 1
                  subtotal: 170
                  updatedAt: "2024-10-05T18:20:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"
