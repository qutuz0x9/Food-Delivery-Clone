restaurantReview:
  parameters:
    - name: reviewId
      in: path
      required: true
      description: Unique identifier of the review.
      schema:
        type: string
        format: uuid
      example: 9cbcd5fc-2edf-52da-9921-c8c55d3d05a1

  get:
    tags:
      - Reviews

    summary: View own restaurant review

    description: |
      Returns one of the customer's restaurant reviews in any moderation state. Only the review's
      author can use this endpoint; anyone else gets `404`.

    operationId: getMyRestaurantReview

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Review retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/GetMyRestaurantReviewResponse"
            example:
              success: true
              message: Review retrieved successfully
              data:
                review:
                  id: 9cbcd5fc-2edf-52da-9921-c8c55d3d05a1
                  authorName: John D.
                  rating: 4
                  title: Great grills
                  comment: Tasty food, a bit late.
                  isEdited: false
                  images:
                    - id: c2779949-0759-5883-98e6-8ef9d8da783e
                      imageUrl: https://cdn.example.com/reviews/1/photo1.jpg
                      sortOrder: 0
                  reply:
                    reply: Thank you, we are working on delivery times.
                    createdAt: "2024-10-06T09:00:00.000Z"
                    updatedAt: "2024-10-06T09:00:00.000Z"
                  createdAt: "2024-10-05T20:00:00.000Z"
                  publishedAt: "2024-10-06T08:00:00.000Z"
                  orderId: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
                  orderNumber: ORD-1001
                  status: published
                  updatedAt: "2024-10-05T20:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  patch:
    tags:
      - Reviews

    summary: Edit own restaurant review

    description: |
      Edits the rating, title or comment. The review is marked as edited and keeps its moderation
      status. Only the review's author can use this endpoint; anyone else gets `404`.

    operationId: updateRestaurantReview

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/review.yaml#/UpdateReviewRequest"
          examples:
            valid:
              summary: Valid request
              value:
                rating: 5
                comment: Even better than last time.
            emptyBody:
              summary: Empty body (400)
              value: {}
            ratingTooLow:
              summary: "`rating` below the minimum of 1 (400)"
              value:
                rating: 0
                comment: Even better than last time.

    responses:
      "200":
        description: Review updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/UpdateRestaurantReviewResponse"
            example:
              success: true
              message: Review updated successfully
              data:
                review:
                  id: 9cbcd5fc-2edf-52da-9921-c8c55d3d05a1
                  authorName: John D.
                  rating: 5
                  title: Great grills
                  comment: Even better than last time.
                  isEdited: true
                  images:
                    - id: c2779949-0759-5883-98e6-8ef9d8da783e
                      imageUrl: https://cdn.example.com/reviews/1/photo1.jpg
                      sortOrder: 0
                  reply:
                    reply: Thank you, we are working on delivery times.
                    createdAt: "2024-10-06T09:00:00.000Z"
                    updatedAt: "2024-10-06T09:00:00.000Z"
                  createdAt: "2024-10-05T20:00:00.000Z"
                  publishedAt: "2024-10-06T08:00:00.000Z"
                  orderId: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
                  orderNumber: ORD-1001
                  status: published
                  updatedAt: "2024-10-05T20:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  delete:
    tags:
      - Reviews

    summary: Delete own restaurant review

    description: |
      Withdraws the review: it is marked `deleted`, disappears from the public list, and the
      restaurant's cached rating is recalculated. The record itself is kept. Only the review's author
      can use this endpoint; anyone else gets `404`.

    operationId: deleteRestaurantReview

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Review deleted successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/DeleteRestaurantReviewResponse"
            example:
              success: true
              message: Review deleted successfully
              data: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantReviewImages:
  parameters:
    - name: reviewId
      in: path
      required: true
      description: Unique identifier of the review.
      schema:
        type: string
        format: uuid
      example: 9cbcd5fc-2edf-52da-9921-c8c55d3d05a1

  post:
    tags:
      - Reviews

    summary: Add a photo to a review

    description: |
      Attaches a photo to one of the customer's restaurant reviews. Only the review's author can use
      this endpoint; anyone else gets `404`.

    operationId: addRestaurantReviewImage

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - image
            properties:
              image:
                type: string
                format: binary
                description: Photo file (JPEG or PNG).

              sortOrder:
                type: integer
                minimum: 0
                default: 0
                description: Position among the review's photos.

    responses:
      "201":
        description: Photo added successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/AddReviewImageResponse"
            example:
              success: true
              message: Photo added successfully
              data:
                image:
                  id: c2779949-0759-5883-98e6-8ef9d8da783e
                  imageUrl: https://cdn.example.com/reviews/1/photo1.jpg
                  sortOrder: 0

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantReviewImage:
  parameters:
