orderRestaurantReview:
  parameters:
    - name: orderId
      in: path
      required: true
      description: Unique identifier of the order.
      schema:
        type: string
        format: uuid
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

  post:
    tags:
      - Reviews

    summary: Review the restaurant

    description: |
      Reviews the restaurant of one of the customer's orders. The order must be `delivered`, and an
      order can be reviewed only once (`409` otherwise). The review starts `pending` and becomes
      public once an administrator publishes it.

    operationId: createRestaurantReview

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/review.yaml#/CreateReviewRequest"
          examples:
            valid:
              summary: Valid request
              value:
                rating: 4
                title: Great grills
                comment: Tasty food, a bit late.
            missingRating:
              summary: Missing required `rating` (400)
              value:
                title: Great grills
                comment: Tasty food, a bit late.
            ratingTooLow:
              summary: "`rating` below the minimum of 1 (400)"
              value:
                rating: 0
                title: Great grills
                comment: Tasty food, a bit late.

    responses:
      "201":
        description: Review submitted
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/CreateRestaurantReviewResponse"
            example:
              success: true
              message: Review submitted successfully. It will be shown once it has been approved.
              data:
                review:
                  id: 9cbcd5fc-2edf-52da-9921-c8c55d3d05a1
                  authorName: John D.
                  rating: 4
                  title: Great grills
                  comment: Tasty food, a bit late.
                  isEdited: false
                  images:
                    - id: c2779949-0759-5883-98e6-8ef9d8da783e
                      imageUrl: https://cdn.example.com/reviews/1/photo1.jpg
                      sortOrder: 0
                  createdAt: "2024-10-05T20:00:00.000Z"
                  publishedAt: null
                  orderId: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
                  orderNumber: ORD-1001
                  status: pending
                  updatedAt: "2024-10-05T20:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

orderDriverReview:
  parameters:
    - name: orderId
      in: path
      required: true
      description: Unique identifier of the order.
      schema:
        type: string
        format: uuid
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

  post:
    tags:
      - Reviews

    summary: Review the driver

    description: |
      Reviews the driver who delivered one of the customer's orders. The order must be `delivered` and
      have had a driver, and an order's driver can be reviewed only once (`409` otherwise). The review
      starts `pending` and becomes public once an administrator publishes it.

    operationId: createDriverReview

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/review.yaml#/CreateReviewRequest"
          examples:
            valid:
              summary: Valid request
              value:
                rating: 5
                title: Fast and polite
                comment: Arrived early and the food was still hot.
            missingRating:
              summary: Missing required `rating` (400)
              value:
                title: Fast and polite
                comment: Arrived early and the food was still hot.
            ratingTooLow:
              summary: "`rating` below the minimum of 1 (400)"
              value:
                rating: 0
                title: Fast and polite
                comment: Arrived early and the food was still hot.

    responses:
      "201":
        description: Review submitted
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/CreateDriverReviewResponse"
            example:
              success: true
              message: Review submitted successfully. It will be shown once it has been approved.
              data:
                review:
                  id: 05d4f94b-3812-570d-848c-c7db2eeef83f
                  authorName: John D.
                  rating: 5
                  title: Fast and polite
                  comment: Arrived early and the food was still hot.
                  isEdited: false
                  createdAt: "2024-10-05T20:00:00.000Z"
                  publishedAt: null
                  orderId: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
                  orderNumber: ORD-1001
                  status: pending
                  updatedAt: "2024-10-05T20:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantReviews:
  parameters:
    - name: restaurantId
      in: path
      required: true
      description: Unique identifier of the restaurant.
      schema:
        type: string
        format: uuid
      example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f

  get:
    tags:
      - Reviews

    summary: List a restaurant's reviews

    description: |
      Returns the published reviews of an approved restaurant, newest first, with the restaurant's
      reply when it has one. Publicly accessible; no authentication required.

    operationId: listRestaurantReviews

    security: []

    parameters:
      - name: rating
        in: query
        required: false
        description: Only reviews with this rating.
        schema:
          type: integer
          minimum: 1
          maximum: 5
        example: 5
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        description: Number of results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20

    responses:
      "200":
        description: Reviews retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/ListRestaurantReviewsResponse"
            example:
              success: true
              message: Reviews retrieved successfully
              data:
                reviews:
                  - id: 9cbcd5fc-2edf-52da-9921-c8c55d3d05a1
                    authorName: John D.
                    rating: 4
                    title: Great grills
                    comment: Tasty food, a bit late.
                    isEdited: false
                    images:
                      - id: c2779949-0759-5883-98e6-8ef9d8da783e
                        imageUrl: https://cdn.example.com/reviews/1/photo1.jpg
                        sortOrder: 0
                    reply:
                      reply: Thank you, we are working on delivery times.
                      createdAt: "2024-10-06T09:00:00.000Z"
                      updatedAt: "2024-10-06T09:00:00.000Z"
                    createdAt: "2024-10-05T20:00:00.000Z"
                    publishedAt: "2024-10-06T08:00:00.000Z"
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 57
                  totalPages: 3

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

