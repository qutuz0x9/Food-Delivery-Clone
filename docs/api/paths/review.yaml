  post:
    tags:
      - Reviews

    summary: Reply to a review

    description: |
      Writes the restaurant's reply to a published review. A review can have only one reply (`409` if
      it already has one); change it with `PATCH` instead.

    operationId: replyToReview

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/review.yaml#/ReplyToReviewRequest"
          examples:
            valid:
              summary: Valid request
              value:
                reply: Thank you, we are working on delivery times.
            missingReply:
              summary: Missing required `reply` (400)
              value: {}
            blankReply:
              summary: "`reply` is empty (400)"
              value:
                reply: ""

    responses:
      "201":
        description: Reply saved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yaml#/ReplyToReviewResponse"
            example:
              success: true
              message: Reply saved successfully
              data:
