    description: |
      Creates a refund for a payment. The payment must be `paid` or `partially_refunded`, and the amount cannot exceed what is still refundable (the payment amount minus refunds that are pending or completed); otherwise the call is rejected with `409`. The refund starts `pending`; when it is completed the payment becomes `partially_refunded`, or `refunded` once the whole amount is returned.

      The change is recorded in the audit log.

    operationId: createRefund

    security:
      - bearerAuth: []

    requestBody:
      required: true
