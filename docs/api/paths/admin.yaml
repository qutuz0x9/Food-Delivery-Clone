loginAdmin:
  post:
    tags:
      - Auth

    summary: Log in an administrator

    description: |
      Authenticates an administrator using their email and password.

      On success, issues a JWT access token in the response body and a refresh token in an `HttpOnly` cookie (`Set-Cookie`); the refresh token is never returned in the body.

      Only accounts whose `account_status` is `active` can log in. A `suspended`, `locked` or `inactive` account is rejected with `403`, and only after the email and password have been verified, so the response does not reveal whether an email is registered.

    operationId: loginAdmin

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/LoginAdminRequest"
          example:
            email: sara.mostafa@example.com
            password: StrongPassword123!

    responses:
      "200":
        description: Administrator logged in successfully
        headers:
          Set-Cookie:
            description: |
              Sets the `refreshToken` cookie. It is `HttpOnly`, `Secure` and `SameSite=Strict`, so scripts cannot read it
              and the browser sends it back on its own. It is never returned in the response body.
            schema:
              type: string
            example: refreshToken=9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/LoginAdminResponse"
            example:
              success: true
              message: Logged in successfully
              data:
                admin:
                  id: 383e47af-52e5-51be-b66f-057bcb14629c
                  firstName: Sara
                  lastName: Mostafa
                  email: sara.mostafa@example.com
                  phoneNumber: "+201112223334"
                  profileImageUrl: null
                  createdAt: "2024-01-02T08:00:00.000Z"
                  updatedAt: null
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

logoutAdmin:
  post:
    tags:
      - Auth

    summary: Log out an administrator

    description: |
      Logs out the currently authenticated administrator by revoking the refresh token.

      The refresh token is read from the `refreshToken` HttpOnly cookie set during login. The response clears the cookie.

    operationId: logoutAdmin

    security:
      - bearerAuth: []

    parameters:
      - name: refreshToken
        in: cookie
        required: true
        description: |
          Refresh token set by the administrator login response. The browser sends it automatically. It is not
          accepted in the request body or as a query parameter.
        schema:
          type: string

    responses:
      "200":
        description: Administrator logged out successfully
        headers:
          Set-Cookie:
            description: Expires the `refreshToken` cookie so the browser discards it.
            schema:
              type: string
            example: refreshToken=; Max-Age=0; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/LogoutAdminResponse"
            example:
              success: true
              message: Logged out successfully
              data: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

refreshAdmin:
  post:
    tags:
      - Auth

    summary: Refresh an administrator access token

    description: |
      Issues a new JWT access token using the `refreshToken` cookie set at login.

      The refresh token is rotated on every call, and presenting an already-rotated or revoked token revokes the whole chain. The cookie is the credential, so no `Authorization` header is needed. Rejected with `401` if the cookie is missing, unknown, expired or revoked, and with `403` if the token does not belong to an administrator or the account is no longer `active`.

    operationId: refreshAdmin

    security: []

    parameters:
      - name: refreshToken
        in: cookie
        required: true
        description: |
          Refresh token set by the administrator login response. The browser sends it automatically. It is not
          accepted in the request body or as a query parameter.
        schema:
          type: string

    responses:
      "200":
        description: Access token refreshed successfully
        headers:
          Set-Cookie:
            description: |
              Sets the `refreshToken` cookie. It is `HttpOnly`, `Secure` and `SameSite=Strict`, so scripts cannot read it
              and the browser sends it back on its own. It is never returned in the response body.
            schema:
              type: string
            example: refreshToken=9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/RefreshAdminResponse"
            example:
              success: true
              message: Access token refreshed successfully
              data:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

      "401":
        $ref: "../responses/common.yaml#/InvalidRefreshToken"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

forgotPasswordAdmin:
  post:
    tags:
      - Auth

    summary: Request an administrator password reset

    description: |
      Starts password recovery. If the email matches an administrator account, a reset token is
      emailed. The response is always the same generic message, whether or not the email is
      registered.

    operationId: forgotPasswordAdmin

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/ForgotPasswordAdminRequest"
          example:
            email: sara.mostafa@example.com

    responses:
      "200":
        description: Request accepted
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/ForgotPasswordAdminResponse"
            example:
              success: true
              message: If an account with that email exists, a password reset link has been sent.
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

resetPasswordAdmin:
  post:
    tags:
      - Auth

    summary: Reset an administrator password

    description: |
      Completes password recovery with the emailed token. The token must be unused and unexpired; on
      success it is marked as used and all the account's refresh tokens are revoked.

    operationId: resetPasswordAdmin

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/ResetPasswordAdminRequest"
          example:
            token: 9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6
            newPassword: NewStrongPassword123!
            confirmPassword: NewStrongPassword123!

    responses:
      "200":
        description: Password reset successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/ResetPasswordAdminResponse"
            example:
              success: true
              message: Password reset successfully. Please log in again.
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "422":
        $ref: "../responses/common.yaml#/InvalidResetToken"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

