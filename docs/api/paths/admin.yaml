adminCustomerAccountStatus:
  parameters:
    - name: customerId
      in: path
      required: true
      description: Unique identifier of the customer.
      schema:
        type: string
        format: uuid
      example: 7d8c5e9a-8b2f-4c1a-9d72-123456789abc

  patch:
    tags:
      - Admin Management

    summary: Change a customer's account status

    description: |
      Sets the login state of the customer's user account (`active`, `inactive`, `locked` or `suspended`). Only `active` accounts can log in. Moving an account out of `active` revokes its refresh tokens, so the user is signed out once their access token expires.

      The change is recorded in the audit log.

    operationId: updateCustomerAccountStatus

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/UpdateAccountStatusRequest"
          example:
            accountStatus: suspended

    responses:
      "200":
        description: Account status updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/UpdateCustomerAccountStatusResponse"
            example:
              success: true
              message: Account status updated successfully
              data:
                customer:
                  id: 7d8c5e9a-8b2f-4c1a-9d72-123456789abc
                  userId: 1f89c291-94ac-59fd-a6b3-23578af30f0f
                  firstName: John
                  lastName: Doe
                  email: john@example.com
                  phoneNumber: "+201234567890"
                  accountStatus: suspended
                  emailVerified: true
                  createdAt: "2024-01-15T10:30:00.000Z"

