adminOrders:
  get:
    tags:
      - Admin Operations

    summary: List, search and filter orders

    description: Returns a paginated list of orders across the whole platform, newest first.

    operationId: listAdminOrders

    security:
      - bearerAuth: []

    parameters:
      - name: search
        in: query
        required: false
        description: Free-text search on order number, customer name or phone number.
        schema:
          type: string
        example: john
      - name: status
        in: query
        required: false
        description: Only orders in this status.
        schema:
          $ref: "../schemas/order.yaml#/OrderStatus"
        example: delivered
      - name: customerId
        in: query
        required: false
        description: Only this customer's orders.
        schema:
          type: string
          format: uuid
        example: 7d8c5e9a-8b2f-4c1a-9d72-123456789abc
      - name: restaurantId
        in: query
        required: false
        description: Only this restaurant's orders.
        schema:
          type: string
          format: uuid
        example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
      - name: branchId
        in: query
        required: false
        description: Only orders fulfilled by this branch.
        schema:
          type: string
          format: uuid
        example: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30
      - name: cityId
        in: query
        required: false
        description: Only orders fulfilled by a branch in this city.
        schema:
          type: string
          format: uuid
        example: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
      - name: from
        in: query
        required: false
        description: Only orders placed on or after this day.
        schema:
          type: string
          format: date
        example: "2024-10-01"
      - name: to
        in: query
        required: false
        description: Only orders placed on or before this day.
        schema:
          type: string
          format: date
        example: "2024-10-31"
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        description: Number of results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20

    responses:
      "200":
        description: Orders retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/ListAdminOrdersResponse"
            example:
              success: true
