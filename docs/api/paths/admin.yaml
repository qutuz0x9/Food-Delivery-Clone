      example: e035c191-7d58-52be-9f78-c9a9351192dd

  patch:
    tags:
      - Admin Management

    summary: Approve or deactivate a driver

    description: |
      Sets the driver's approval state. `active` approves the driver, who can then go available and receive delivery requests. `inactive` takes the driver out of service. There is no `rejected` value for drivers: a registration that should not go ahead is set to `inactive`. Login is controlled separately by the account status.

      The change is recorded in the audit log.

    operationId: updateDriverStatus

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/UpdateDriverStatusRequest"
          example:
            status: active

    responses:
      "200":
        description: Driver status updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/UpdateDriverStatusResponse"
            example:
              success: true
              message: Driver status updated successfully
              data:
                driver:
                  id: e035c191-7d58-52be-9f78-c9a9351192dd
                  firstName: Omar
                  lastName: Hassan
                  email: omar.hassan@example.com
                  phoneNumber: "+201001234567"
                  workingCity:
                    id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                  status: active
                  availabilityStatus: available
                  rating: 4.8
                  totalDeliveries: 312
                  createdAt: "2024-01-10T09:00:00.000Z"
                  userId: 0611da80-d0d0-535a-8bf9-6503cef2f460
                  accountStatus: active

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

adminDriverAccountStatus:
  parameters:
    - name: driverId
      in: path
      required: true
      description: Unique identifier of the driver.
      schema:
        type: string
        format: uuid
      example: e035c191-7d58-52be-9f78-c9a9351192dd

  patch:
    tags:
      - Admin Management

    summary: Change a driver's account status

    description: |
      Sets the login state of the driver's user account (`active`, `inactive`, `locked` or `suspended`). This is separate from the approval state. Only `active` accounts can log in. Moving an account out of `active` revokes its refresh tokens, so the user is signed out once their access token expires.

      The change is recorded in the audit log.

    operationId: updateDriverAccountStatus

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/UpdateAccountStatusRequest"
          example:
            accountStatus: suspended

    responses:
      "200":
        description: Account status updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/UpdateDriverAccountStatusResponse"
            example:
              success: true
              message: Account status updated successfully
              data:
                driver:
                  id: e035c191-7d58-52be-9f78-c9a9351192dd
                  firstName: Omar
                  lastName: Hassan
                  email: omar.hassan@example.com
                  phoneNumber: "+201001234567"
