adminOrdersReport:
  get:
    tags:
      - Admin Insights

    summary: Orders report

    description: |
      Counts orders per day, week or month for a period: how many were placed, delivered, cancelled
      and rejected.

    operationId: getOrdersReport

    security:
      - bearerAuth: []

    parameters:
      - name: from
        in: query
        required: true
        description: First day of the report.
        schema:
          type: string
          format: date
        example: "2024-10-01"
      - name: to
        in: query
        required: true
        description: Last day of the report.
        schema:
          type: string
          format: date
        example: "2024-10-07"
      - name: groupBy
        in: query
        required: false
        description: How rows are grouped.
        schema:
          type: string
          enum:
            - day
            - week
            - month
          default: day
        example: day
      - name: cityId
        in: query
        required: false
        description: Only orders fulfilled by a branch in this city.
        schema:
          type: string
          format: uuid
        example: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
      - name: restaurantId
        in: query
        required: false
        description: Only this restaurant's orders.
        schema:
          type: string
          format: uuid
        example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f

    responses:
      "200":
        description: Report generated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/GetOrdersReportResponse"
            example:
              success: true
              message: Report generated successfully
              data:
                report:
                  groupBy: day
                  from: "2024-10-01"
                  to: "2024-10-07"
                  rows:
                    - period: "2024-10-05"
                      orders: 342
                      delivered: 270
                      cancelled: 14
                      rejected: 8

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

