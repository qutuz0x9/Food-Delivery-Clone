    operationId: getAdminProfile

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/GetAdminProfileResponse"
            example:
              success: true
              message: Profile retrieved successfully
              data:
                admin:
                  id: 383e47af-52e5-51be-b66f-057bcb14629c
                  firstName: Sara
                  lastName: Mostafa
                  email: sara.mostafa@example.com
                  phoneNumber: "+201112223334"
                  profileImageUrl: null
                  createdAt: "2024-01-02T08:00:00.000Z"
                  updatedAt: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  patch:
    tags:
      - Admin Management

    summary: Update own administrator profile

    description: |
      Updates the profile of the currently authenticated administrator. Only the supplied fields
      change. The phone number belongs to the user account and must stay unique (`409` otherwise); the
      login email cannot be changed here.

    operationId: updateAdminProfile

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/UpdateAdminProfileRequest"
          example:
            firstName: Sara
            phoneNumber: "+201112223334"

    responses:
      "200":
        description: Profile updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/UpdateAdminProfileResponse"
            example:
              success: true
              message: Profile updated successfully
              data:
                admin:
                  id: 383e47af-52e5-51be-b66f-057bcb14629c
                  firstName: Sara
                  lastName: Mostafa
                  email: sara.mostafa@example.com
                  phoneNumber: "+201112223334"
                  profileImageUrl: null
                  createdAt: "2024-01-02T08:00:00.000Z"
                  updatedAt: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

changePasswordAdmin:
  post:
    tags:
      - Admin Management

    summary: Change own password

    description: |
      Changes the password of the currently authenticated administrator. The current password must be
      supplied. Existing refresh tokens are revoked.

    operationId: changePasswordAdmin

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/ChangePasswordAdminRequest"
          example:
            currentPassword: StrongPassword123!
            newPassword: NewStrongPassword123!
            confirmPassword: NewStrongPassword123!

    responses:
      "200":
        description: Password changed successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/ChangePasswordAdminResponse"
            example:
              success: true
              message: Password changed successfully
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

adminCities:
  get:
    tags:
      - Admin Management

    summary: List all cities

    description: |
      Returns every city, including inactive ones. The public `GET /cities` returns active cities
      only.

    operationId: listAdminCities

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Cities retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/ListAdminCitiesResponse"
            example:
              success: true
              message: Cities retrieved successfully
              data:
                cities:
                  - id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                    isActive: true
                    createdAt: "2024-01-01T00:00:00.000Z"
                  - id: 7a4c1e92-0d5b-4b3f-9e68-1f2a3b4c5d6e
                    name: Giza
                    country: Egypt
                    isActive: true
                    createdAt: "2024-01-01T00:00:00.000Z"
                  - id: 0aae3b6d-0c04-58f1-b1f8-19a93a590e95
                    name: Suez
                    country: Egypt
                    isActive: false
                    createdAt: "2024-01-01T00:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  post:
    tags:
      - Admin Management

    summary: Add a city

    description: |
      Adds a city the platform operates in. Cities are unique by name and country (`409` otherwise). Restaurants, drivers and customers refer to a city by its id.

      The change is recorded in the audit log.

    operationId: createCity

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/CreateCityRequest"
          example:
            name: Alexandria
            country: Egypt

    responses:
      "201":
        description: City created successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/CreateCityResponse"
            example:
              success: true
              message: City created successfully
              data:
                city:
                  id: fb5ea528-dd50-572f-92e9-a515a0a99af1
                  name: Alexandria
                  country: Egypt
                  isActive: true
                  createdAt: "2024-01-01T00:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

adminCity:
  parameters:
    - name: cityId
      in: path
      required: true
      description: Unique identifier of the city.
      schema:
        type: string
        format: uuid
      example: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21

  patch:
    tags:
      - Admin Management

    summary: Update or deactivate a city

    description: |
      Updates a city. Cities are never deleted: set `isActive` to `false` to take one out of service. It then disappears from `GET /cities`, while branches, drivers and addresses that already refer to it keep working. The name and country must stay unique (`409`).

      The change is recorded in the audit log.

    operationId: updateCity

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/UpdateCityRequest"
          example:
            isActive: false

    responses:
      "200":
        description: City updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/UpdateCityResponse"
            example:
              success: true
              message: City updated successfully
              data:
                city:
                  id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                  name: Cairo
                  country: Egypt
                  isActive: false
                  createdAt: "2024-01-01T00:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

adminCustomers:
  get:
    tags:
      - Admin Management

    summary: List and search customers

    description: |
      Returns a paginated list of customer accounts, newest first. Accounts that were deleted are not
      listed.

    operationId: listAdminCustomers

    security:
      - bearerAuth: []

    parameters:
      - name: search
        in: query
        required: false
        description: Free-text search on name, email or phone number.
        schema:
          type: string
        example: john
      - name: accountStatus
        in: query
        required: false
        description: Only accounts with this login state.
        schema:
          $ref: "../schemas/admin.yaml#/AccountStatus"
        example: active
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        description: Number of results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20

    responses:
      "200":
        description: Customers retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/ListAdminCustomersResponse"
            example:
              success: true
              message: Customers retrieved successfully
              data:
                customers:
                  - id: 7d8c5e9a-8b2f-4c1a-9d72-123456789abc
                    userId: 1f89c291-94ac-59fd-a6b3-23578af30f0f
                    firstName: John
                    lastName: Doe
                    email: john@example.com
                    phoneNumber: "+201234567890"
                    accountStatus: active
                    emailVerified: true
                    createdAt: "2024-01-15T10:30:00.000Z"
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 57
                  totalPages: 3

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

adminCustomer:
  parameters:
