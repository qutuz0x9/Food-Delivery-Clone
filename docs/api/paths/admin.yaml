                    payoutId: 96ccc283-c80a-50f4-aa26-931dc0f37dbf
                    createdAt: "2024-10-05T19:20:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  patch:
    tags:
      - Admin Operations

    summary: Update a payout's status

    description: |
      Moves a payout through its states (`pending`, `processing`, `completed`, `failed`, `on_hold`, `cancelled`). Completing a payout requires a paid-at time and uses the current time if none is given. The earnings it settles take the payout's status.

      The change is recorded in the audit log.

    operationId: updatePayout

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/UpdatePayoutRequest"
          example:
            status: completed
            paidAt: "2024-10-07T10:00:00.000Z"

    responses:
      "200":
        description: Payout updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/UpdatePayoutResponse"
            example:
              success: true
              message: Payout updated successfully
              data:
                payout:
                  id: 96ccc283-c80a-50f4-aa26-931dc0f37dbf
                  driver:
                    id: e035c191-7d58-52be-9f78-c9a9351192dd
                    name: Omar Hassan
                  periodStart: "2024-09-29"
                  periodEnd: "2024-10-05"
                  amount: 1450
                  status: completed
                  paidAt: "2024-10-07T10:00:00.000Z"
                  earningCount: 38

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

adminAuditLogs:
  get:
    tags:
      - Admin Insights

    summary: Search the audit log

    description: Returns a paginated list of recorded actions, newest first. The log is read-only.

    operationId: listAuditLogs

    security:
      - bearerAuth: []

    parameters:
      - name: userId
        in: query
        required: false
        description: Only actions by this user account.
        schema:
          type: string
          format: uuid
        example: 97cb9ca6-a304-5227-956d-e9b0bf0f83cc
      - name: action
        in: query
        required: false
        description: Only this action.
        schema:
          type: string
        example: order.status.update
      - name: entityName
        in: query
        required: false
        description: Only changes to this kind of record.
        schema:
          type: string
        example: orders
      - name: entityId
        in: query
        required: false
        description: Only changes to this record.
        schema:
          type: string
          format: uuid
        example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
      - name: status
        in: query
        required: false
        description: Only actions with this outcome.
        schema:
          type: string
        example: success
      - name: from
        in: query
        required: false
        description: Only actions on or after this time.
        schema:
          type: string
          format: date-time
        example: "2024-10-01T00:00:00.000Z"
      - name: to
        in: query
        required: false
        description: Only actions on or before this time.
        schema:
          type: string
          format: date-time
        example: "2024-10-31T23:59:59.000Z"
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        description: Number of results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20

    responses:
      "200":
        description: Audit log retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/admin.yaml#/ListAuditLogsResponse"
            example:
              success: true
              message: Audit log retrieved successfully
              data:
                entries:
                  - id: 50ae95e4-d466-5172-81c9-3bf14f3dd388
                    userId: 97cb9ca6-a304-5227-956d-e9b0bf0f83cc
                    actorEmail: sara.mostafa@example.com
                    action: order.status.update
                    entityName: orders
                    entityId: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
                    oldValue:
                      status: ready_for_pickup
                    newValue:
                      status: cancelled
                    ipAddress: 203.0.113.24
                    requestId: req_7f3a9c
                    userAgent: Mozilla/5.0
                    status: success
                    createdAt: "2024-10-05T19:40:00.000Z"
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 57
                  totalPages: 3

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

