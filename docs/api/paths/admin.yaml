    description: |
      Sets the login state of the restaurant's user account (`active`, `inactive`, `locked` or `suspended`). This is separate from the approval state. Only `active` accounts can log in. Moving an account out of `active` revokes its refresh tokens, so the user is signed out once their access token expires.

      The change is recorded in the audit log.

    operationId: updateRestaurantAccountStatus

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/admin.yaml#/UpdateAccountStatusRequest"
          example:
            accountStatus: suspended

