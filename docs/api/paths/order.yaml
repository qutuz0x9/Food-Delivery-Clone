      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

orderCancellation:
  parameters:
    - name: orderId
      in: path
      required: true
      description: Unique identifier of the order.
      schema:
        type: string
        format: uuid
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

  post:
    tags:
      - Orders

    summary: Cancel an order

    description: |
      Cancels the customer's order. An order can only be cancelled while it is `pending`, before the
      restaurant has accepted it; after that the call is rejected with `409`. The order moves to
      `cancelled`, `cancelledAt` is set, the optional `reason` is stored in the status history, and if
      the order was already paid a refund for the full amount is started.

    operationId: cancelOrder

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/order.yaml#/CancelOrderRequest"
          example:
            reason: Ordered by mistake

    responses:
      "200":
        description: Order cancelled successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/order.yaml#/CancelOrderResponse"
            example:
              success: true
              message: Order cancelled successfully
              data:
