orders:
  post:
    tags:
      - Orders

    summary: Place an order

    description: |
      Turns the customer's cart into an order.

      The server chooses the fulfilling branch: the nearest active, open branch of the restaurant, among those in the delivery address's city, measured from the address coordinates. If no branch is open there the call is rejected with `409`. It is also rejected with `409` when the cart is empty, an item is no longer available, the restaurant is not approved, or the subtotal is below the restaurant's minimum order amount.

      Options and special instructions are supplied per cart item in `items`. Every option group's minimum, maximum and required rules must be met (`400` otherwise). The delivery fee comes from the restaurant, and the subtotal, tax, discount and total are always calculated by the server (total = subtotal + delivery fee + tax − discount).

      In one step the order is created as `pending` with a unique order number, a copy of the delivery address and of the chosen options is stored with it, the first entry is added to the status history, a payment is created for `paymentMethod`, and the cart is deleted.

    operationId: placeOrder

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/order.yaml#/PlaceOrderRequest"
          example:
            deliveryAddressId: deebf84a-2ed2-579a-80d7-b820d7e655c4
            paymentMethod: credit_card
            customerNote: Please ring the bell
            items:
              - cartItemId: 502199a9-304a-553b-ad69-1bf2baa4391e
                specialInstructions: No onions
                options:
                  - optionGroupId: 56658202-efc2-556c-97f7-bd7b0ad03a99
                    optionValueId: 205313e7-080a-56ba-ae8f-17b29d6058cb

    responses:
      "201":
        description: Order placed successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/order.yaml#/PlaceOrderResponse"
            example:
              success: true
              message: Order placed successfully
              data:
                order:
                  id: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
                  orderNumber: ORD-1001
                  status: pending
                  customerId: 7d8c5e9a-8b2f-4c1a-9d72-123456789abc
                  customerName: John Doe
                  restaurantId: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
