orderTracking:
  parameters:
    - name: orderId
      in: path
      required: true
      description: Unique identifier of the order.
      schema:
        type: string
        format: uuid
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

  get:
    tags:
      - Orders

    summary: Track the delivery driver

    description: |
      Returns the delivering driver and their latest position. `driver` is `null` until a driver
      accepts, and `location` is only available while the order is `picked_up` or `out_for_delivery`.

    operationId: getOrderTracking

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Order tracking retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/order.yaml#/GetOrderTrackingResponse"
            example:
              success: true
              message: Order tracking retrieved successfully
              data:
                tracking:
                  orderNumber: ORD-1001
                  status: out_for_delivery
                  driver:
                    name: Omar Hassan
                    rating: 4.8
                    vehicle:
                      vehicleType: motorcycle
                      brand: Honda
                      model: CB125
                      color: Red
                      plateNumber: ABC 1234
                  location:
                    latitude: 30.0501
                    longitude: 31.24
                    heading: 90
                    speed: 32.5
                    recordedAt: "2024-10-05T19:10:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
