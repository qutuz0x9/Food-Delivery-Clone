restaurantOrders:
  get:
    tags:
      - Restaurant Orders

    summary: List restaurant orders

    description: |
      Returns the orders placed with the authenticated restaurant, across all its branches, newest
      first.

    operationId: listRestaurantOrders

    security:
      - bearerAuth: []

    parameters:
      - name: status
        in: query
        required: false
        description: Only orders in this status.
        schema:
          $ref: "../schemas/order.yaml#/OrderStatus"
        example: pending
      - name: branchId
        in: query
        required: false
        description: Only orders fulfilled by this branch.
        schema:
          type: string
          format: uuid
        example: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30
      - name: from
