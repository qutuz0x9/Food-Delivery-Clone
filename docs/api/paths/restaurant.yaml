    summary: List own branches
    description: |
      Returns every branch of the currently authenticated restaurant,
      including inactive ones. A restaurant trades through its branches:
      each has its own address, opening hours and availability. No
      requirement names branches directly; they extend the restaurant
      profile.

    operationId: listBranches

    security:
