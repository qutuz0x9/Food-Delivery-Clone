      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

registerRestaurant:
  post:
    tags:
      - Auth

    summary: Register a restaurant
    description: |
      Creates a new restaurant account.

      Validates the supplied information, verifies email uniqueness,
      creates the underlying user identity, and creates the restaurant
      profile together with its first branch. The new restaurant is
      created with `pending` status and cannot receive orders until an
      administrator approves it. The first branch is created `closed`;
      more branches are added with the branch endpoints.

    operationId: registerRestaurant

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/RegisterRestaurantRequest"
          examples:
            valid:
              summary: Valid request
              value:
                name: Nile Grill House
                email: contact@nilegrill.example.com
                password: StrongPassword123!
                phoneNumber: "+201234567890"
                description: Authentic Egyptian grills and mezze.
                branch:
                  label: Ramses Branch
                  cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                  street: 15 Ramses St
                  building: Building 4
                  latitude: 30.0561
                  longitude: 31.2394
            emptyBody:
              summary: Empty body (400)
              value: {}
            missingName:
              summary: Missing required `name` (400)
              value:
                email: contact@nilegrill.example.com
                password: StrongPassword123!
                phoneNumber: "+201234567890"
                description: Authentic Egyptian grills and mezze.
                branch:
                  label: Ramses Branch
                  cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                  street: 15 Ramses St
                  building: Building 4
                  latitude: 30.0561
                  longitude: 31.2394
            nameTooLong:
              summary: "`name` longer than 150 characters (400)"
              value:
                name: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                email: contact@nilegrill.example.com
                password: StrongPassword123!
                phoneNumber: "+201234567890"
                description: Authentic Egyptian grills and mezze.
                branch:
                  label: Ramses Branch
                  cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                  street: 15 Ramses St
                  building: Building 4
                  latitude: 30.0561
                  longitude: 31.2394
            invalidEmail:
              summary: "`email` is not a valid email (400)"
              value:
                name: Nile Grill House
                email: not-an-email
                password: StrongPassword123!
                phoneNumber: "+201234567890"
                description: Authentic Egyptian grills and mezze.
                branch:
                  label: Ramses Branch
                  cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                  street: 15 Ramses St
                  building: Building 4
                  latitude: 30.0561
                  longitude: 31.2394
            passwordTooShort:
              summary: "`password` shorter than 8 characters (400)"
              value:
                name: Nile Grill House
                email: contact@nilegrill.example.com
                password: xxxxxxx
                phoneNumber: "+201234567890"
                description: Authentic Egyptian grills and mezze.
                branch:
                  label: Ramses Branch
                  cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                  street: 15 Ramses St
                  building: Building 4
                  latitude: 30.0561
                  longitude: 31.2394

    responses:
      "201":
        description: Restaurant account created successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/RegisterRestaurantResponse"
            example:
              success: true
              message: Restaurant account created successfully. It is now pending approval.
              data:
                restaurant:
                  id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                  name: Nile Grill House
                  email: contact@nilegrill.example.com
                  phoneNumber: "+201234567890"
