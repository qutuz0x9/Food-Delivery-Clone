restaurantOperatingHours:
  parameters:
    - name: branchId
      in: path
      required: true
      description: Unique identifier of the branch.
      schema:
        type: string
        format: uuid
      example: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30

  get:
    tags:
      - Restaurants

    summary: View operating hours
    description: |
      Returns the weekly operating hours schedule of one branch of the
      currently authenticated restaurant. Hours are set
      per branch.

    operationId: listBranchOperatingHours

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Operating hours retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ListOperatingHoursResponse"
            example:
              success: true
              message: Operating hours retrieved successfully
              data:
                operatingHours:
                  - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    dayOfWeek: 0
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    dayOfWeek: 1
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  put:
    tags:
      - Restaurants

    summary: Replace the weekly operating hours schedule
    description: |
      Replaces the entire weekly operating hours schedule of one branch
      of the currently authenticated restaurant with the supplied
      entries, one per day of the week.

      The request must contain exactly one entry for each `dayOfWeek`
      (0-6, no duplicates). Every entry with `isClosed: false` must
      include both `opensAt` and `closesAt`; closed days may omit
      them. A request that breaks these rules is rejected with `400`.

    operationId: replaceBranchOperatingHours

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/ReplaceOperatingHoursRequest"
          examples:
            valid:
              summary: Valid request
              value:
                operatingHours:
                  - dayOfWeek: 0
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - dayOfWeek: 1
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - dayOfWeek: 2
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - dayOfWeek: 3
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - dayOfWeek: 4
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - dayOfWeek: 5
                    opensAt: "12:00"
                    closesAt: "01:00"
                    isClosed: false
                  - dayOfWeek: 6
                    opensAt: null
                    closesAt: null
                    isClosed: true
            missingOperatingHours:
              summary: Missing required `operatingHours` (400)
              value: {}
            emptyOperatingHours:
              summary: "`operatingHours` has no items (400)"
              value:
                operatingHours: []

    responses:
      "200":
        description: Operating hours updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ReplaceOperatingHoursResponse"
            example:
              success: true
              message: Operating hours updated successfully
              data:
                operatingHours:
                  - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    dayOfWeek: 0
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    dayOfWeek: 6
                    opensAt: null
                    closesAt: null
                    isClosed: true

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

