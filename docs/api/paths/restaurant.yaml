                    isClosed: false
                  - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    dayOfWeek: 6
                    opensAt: null
                    closesAt: null
                    isClosed: true

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantOperatingHour:
  parameters:
    - name: operatingHourId
      in: path
      required: true
      description: Unique identifier of the operating hour entry.
