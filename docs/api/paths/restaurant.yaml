      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  post:
    tags:
      - Restaurants

    summary: Add a branch
    description: |
      Adds a branch to the currently authenticated restaurant. A branch is an address in one city, with its own
      opening hours and availability. It is created active and `closed`,
      so it takes no orders until the restaurant opens it and sets its
      hours.

      Customers see the restaurant in every city where it has an active
      branch, and an order is fulfilled by the nearest active, open
      branch to the customer's delivery address. The label must be
      unique within the restaurant (`409` otherwise).

    operationId: createBranch

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/CreateBranchRequest"
          examples:
            valid:
              summary: Valid request
              value:
                label: Ramses Branch
                cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                street: 15 Ramses St
                building: Building 4
                latitude: 30.0561
                longitude: 31.2394
            emptyBody:
              summary: Empty body (400)
              value: {}
            missingLabel:
              summary: Missing required `label` (400)
              value:
                cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                street: 15 Ramses St
                building: Building 4
                latitude: 30.0561
                longitude: 31.2394
            blankLabel:
              summary: "`label` is empty (400)"
              value:
                label: ""
                cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                street: 15 Ramses St
                building: Building 4
                latitude: 30.0561
                longitude: 31.2394
            invalidCityId:
              summary: "`cityId` is not a valid UUID (400)"
              value:
                label: Ramses Branch
                cityId: not-a-uuid
                street: 15 Ramses St
                building: Building 4
                latitude: 30.0561
                longitude: 31.2394
            latitudeTooLow:
              summary: "`latitude` below the minimum of -90 (400)"
              value:
                label: Ramses Branch
                cityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                street: 15 Ramses St
                building: Building 4
                latitude: -91
                longitude: 31.2394

    responses:
      "201":
        description: Branch created successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/CreateBranchResponse"
            example:
              success: true
              message: Branch created successfully
              data:
                branch:
                  id: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30
                  label: Ramses Branch
                  city:
                    id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                  street: 15 Ramses St
                  building: Building 4
                  latitude: 30.0561
                  longitude: 31.2394
                  availabilityStatus: closed
                  isActive: true
                  createdAt: "2023-11-10T08:00:00.000Z"
                  updatedAt: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

