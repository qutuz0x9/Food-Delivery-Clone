  patch:
    tags:
      - Restaurants

    summary: Update or deactivate a branch
    description: |
      Updates a single branch of the currently authenticated
      restaurant. Only the supplied fields are updated;
      omitted fields remain unchanged. Opening hours and availability
      have their own endpoints.

      Branches are never deleted. Send `isActive: false` to take one
      out of service: it is hidden from customers and no new order is
      routed to it, while orders it already received are unaffected. If
      the restaurant's last active branch is deactivated, the restaurant
      is no longer visible to customers. The label must stay unique
      within the restaurant (`409` otherwise).

    operationId: updateBranch

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
