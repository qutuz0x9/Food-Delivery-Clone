            opensAt: "10:00"
            closesAt: "22:00"
            isClosed: false

    responses:
      "200":
        description: Operating hour updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/UpdateOperatingHourResponse"
            example:
              success: true
              message: Operating hour updated successfully
              data:
                operatingHour:
                  id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  dayOfWeek: 1
                  opensAt: "10:00"
                  closesAt: "22:00"
                  isClosed: false

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantAvailability:
  patch:
    tags:
      - Restaurants

    summary: Change restaurant availability
    description: |
      Updates the real-time availability status of the currently
      authenticated restaurant (FR-RES-007.1, FR-RES-007.2), used to
      mark the restaurant as `open`, `closed`, or temporarily `busy`
      independent of its scheduled operating hours.

    operationId: updateRestaurantAvailability

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/UpdateAvailabilityRequest"
          example:
            availabilityStatus: closed

    responses:
      "200":
        description: Restaurant availability updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/UpdateAvailabilityResponse"
            example:
              success: true
              message: Restaurant availability updated successfully
              data:
                availabilityStatus: closed

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantMenuCategories:
  get:
    tags:
      - Menu

    summary: List own menu categories
    description: |
      Returns all menu categories (menu sections such as Starters,
      Mains, Drinks) defined by the currently authenticated
      restaurant, including inactive ones (FR-RES-008).

    operationId: listRestaurantMenuCategories

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Menu categories retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/ListMenuCategoriesResponse"
            example:
              success: true
              message: Menu categories retrieved successfully
              data:
                categories:
                  - id: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d
                    name: Grills
                    displayOrder: 1
                    isActive: true
                    createdAt: "2023-11-10T08:00:00.000Z"
                  - id: b8c9d0e1-f2a3-4b4c-5d6e-7f8a9b0c1d2e
                    name: Beverages
                    displayOrder: 2
                    isActive: true
                    createdAt: "2023-11-10T08:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  post:
    tags:
      - Menu

    summary: Create a menu category
    description: |
      Creates a new menu category for the currently authenticated
      restaurant (FR-RES-008.1). Menu items are later assigned to this
      category (FR-RES-009.6).

    operationId: createRestaurantMenuCategory

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/menu.yaml#/CreateMenuCategoryRequest"
          example:
            name: Starters
            displayOrder: 1
            isActive: true

    responses:
      "201":
        description: Menu category created successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/CreateMenuCategoryResponse"
            example:
              success: true
              message: Menu category created successfully
              data:
                category:
                  id: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d
                  name: Starters
                  displayOrder: 1
                  isActive: true
                  createdAt: "2024-01-15T10:30:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantMenuCategory:
  parameters:
    - name: categoryId
      in: path
      required: true
      description: Unique identifier of the menu category.
      schema:
        type: string
        format: uuid
      example: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d

  get:
    tags:
      - Menu

    summary: Get one menu category
    description: |
      Returns a single menu category belonging to the currently
      authenticated restaurant, identified by `categoryId` (FR-RES-008).

    operationId: getRestaurantMenuCategory

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Menu category retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/GetMenuCategoryResponse"
            example:
              success: true
              message: Menu category retrieved successfully
              data:
                category:
                  id: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d
                  name: Grills
                  displayOrder: 1
                  isActive: true
                  createdAt: "2023-11-10T08:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  patch:
    tags:
      - Menu

    summary: Update a menu category
    description: |
      Updates a single menu category belonging to the currently
      authenticated restaurant, identified by `categoryId`
      (FR-RES-008.2). Only the supplied fields are updated; omitted
      fields remain unchanged.

    operationId: updateRestaurantMenuCategory

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/menu.yaml#/UpdateMenuCategoryRequest"
          example:
            name: Starters & Salads
            displayOrder: 2
            isActive: true

    responses:
      "200":
        description: Menu category updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/UpdateMenuCategoryResponse"
            example:
              success: true
              message: Menu category updated successfully
              data:
                category:
                  id: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d
                  name: Starters & Salads
                  displayOrder: 2
                  isActive: true
                  createdAt: "2023-11-10T08:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  delete:
    tags:
      - Menu

    summary: Delete a menu category
    description: |
      Deletes a single menu category belonging to the currently
      authenticated restaurant, identified by `categoryId`
      (FR-RES-008.3).

      A category that still has menu items assigned to it cannot be
      deleted; the items must be reassigned or removed first.

    operationId: deleteRestaurantMenuCategory

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Menu category deleted successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/DeleteMenuCategoryResponse"
            example:
              success: true
              message: Menu category deleted successfully
              data: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"
