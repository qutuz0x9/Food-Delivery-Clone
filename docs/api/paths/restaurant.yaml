                    isActive: true
                    createdAt: "2023-11-10T08:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  post:
    tags:
      - Menu

    summary: Create a menu category
    description: |
      Creates a new menu category for the currently authenticated
      restaurant. Menu items are later assigned to this
      category.

      Category names must be unique among the restaurant's active
      categories (`409` otherwise). An inactive category does not
      reserve its name.

    operationId: createRestaurantMenuCategory

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/menu.yaml#/CreateMenuCategoryRequest"
          examples:
            valid:
              summary: Valid request
              value:
                name: Starters
                displayOrder: 1
                isActive: true
            missingName:
              summary: Missing required `name` (400)
              value:
                displayOrder: 1
                isActive: true
            nameTooLong:
              summary: "`name` longer than 100 characters (400)"
              value:
                name: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                displayOrder: 1
                isActive: true
            displayOrderWrongType:
              summary: "`displayOrder` is text instead of a number (400)"
              value:
                name: Starters
                displayOrder: abc
                isActive: true
            isActiveWrongType:
              summary: "`isActive` is text instead of true/false (400)"
              value:
                name: Starters
                displayOrder: 1
                isActive: yes

    responses:
      "201":
        description: Menu category created successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/CreateMenuCategoryResponse"
            example:
              success: true
              message: Menu category created successfully
              data:
                category:
                  id: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d
                  name: Starters
                  displayOrder: 1
                  isActive: true
                  createdAt: "2024-01-15T10:30:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantMenuCategory:
  parameters:
    - name: categoryId
      in: path
      required: true
      description: Unique identifier of the menu category.
      schema:
        type: string
        format: uuid
      example: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d

  get:
    tags:
      - Menu

    summary: Get one menu category
    description: |
      Returns a single menu category belonging to the currently
      authenticated restaurant, identified by `categoryId`.

    operationId: getRestaurantMenuCategory

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Menu category retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/GetMenuCategoryResponse"
            example:
              success: true
              message: Menu category retrieved successfully
              data:
                category:
                  id: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d
                  name: Grills
                  displayOrder: 1
                  isActive: true
                  createdAt: "2023-11-10T08:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  patch:
    tags:
      - Menu

    summary: Update a menu category
    description: |
      Updates a single menu category belonging to the currently
      authenticated restaurant, identified by `categoryId`. Only the supplied fields are updated; omitted
      fields remain unchanged.

      Category names must be unique among the restaurant's active
      categories (`409` otherwise). An inactive category does not
      reserve its name.
      Reactivating a category is rejected with `409` if an active
      category already uses its name.

    operationId: updateRestaurantMenuCategory

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/menu.yaml#/UpdateMenuCategoryRequest"
          examples:
            valid:
              summary: Valid request
              value:
                name: Starters & Salads
                displayOrder: 2
                isActive: true
            nameTooLong:
              summary: "`name` longer than 100 characters (400)"
              value:
                name: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                displayOrder: 2
                isActive: true
            displayOrderWrongType:
              summary: "`displayOrder` is text instead of a number (400)"
              value:
                name: Starters & Salads
                displayOrder: abc
                isActive: true
            isActiveWrongType:
              summary: "`isActive` is text instead of true/false (400)"
              value:
                name: Starters & Salads
                displayOrder: 2
                isActive: yes

    responses:
      "200":
        description: Menu category updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/UpdateMenuCategoryResponse"
            example:
              success: true
              message: Menu category updated successfully
              data:
                category:
                  id: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d
                  name: Starters & Salads
                  displayOrder: 2
                  isActive: true
                  createdAt: "2023-11-10T08:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  delete:
    tags:
      - Menu

    summary: Delete a menu category
    description: |
      Deletes a single menu category belonging to the currently
      authenticated restaurant, identified by `categoryId`.

      A category that still has menu items assigned to it cannot be
      deleted; the items must be reassigned or removed first.

    operationId: deleteRestaurantMenuCategory

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Menu category deleted successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/DeleteMenuCategoryResponse"
            example:
              success: true
              message: Menu category deleted successfully
              data: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

