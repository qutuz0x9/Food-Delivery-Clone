                  ratingCount: 128
                  address:
                    country: Egypt
                    city: Cairo
                    street: 20 Ramses St
                    building: Building 4
                    latitude: 30.0561
                    longitude: 31.2394
                  createdAt: "2023-11-10T08:00:00.000Z"
                  updatedAt: "2024-02-05T12:15:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

uploadRestaurantLogo:
  post:
    tags:
      - Restaurants

    summary: Upload or update restaurant logo
    description: |
      Uploads a new logo image for the currently authenticated
      restaurant, replacing any existing logo (FR-RES-005.3).

    operationId: uploadRestaurantLogo

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - logo
            properties:
              logo:
                type: string
                format: binary
                description: Logo image file (JPEG or PNG).

    responses:
      "200":
        description: Restaurant logo updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/UploadRestaurantLogoResponse"
            example:
              success: true
              message: Restaurant logo updated successfully
              data:
                logoUrl: https://cdn.example.com/restaurants/nile-grill/logo.jpg

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantOperatingHours:
  get:
    tags:
      - Restaurants

    summary: View operating hours
    description: |
      Returns the weekly operating hours schedule of the currently
      authenticated restaurant (FR-RES-006).

    operationId: listRestaurantOperatingHours

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Operating hours retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ListOperatingHoursResponse"
            example:
              success: true
              message: Operating hours retrieved successfully
              data:
                operatingHours:
                  - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    dayOfWeek: 0
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false
                  - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    dayOfWeek: 1
                    opensAt: "09:00"
                    closesAt: "23:00"
                    isClosed: false

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

