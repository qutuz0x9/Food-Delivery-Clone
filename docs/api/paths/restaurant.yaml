        $ref: "../responses/common.yaml#/InternalServerError"

restaurantSalesStats:
  get:
    tags:
      - Restaurants

    summary: Sales statistics

    description: |
      Totals the money from the restaurant's delivered orders per day, week or month: subtotals,
      delivery fees, tax, discounts and order totals.

    operationId: getRestaurantSalesStats

    security:
      - bearerAuth: []

    parameters:
      - name: from
        in: query
        required: true
        description: First day of the period.
        schema:
          type: string
          format: date
        example: "2024-10-01"
      - name: to
        in: query
        required: true
        description: Last day of the period.
        schema:
          type: string
          format: date
        example: "2024-10-07"
      - name: groupBy
        in: query
        required: false
        description: How rows are grouped.
        schema:
          type: string
          enum:
            - day
            - week
            - month
          default: day
        example: day
      - name: branchId
        in: query
        required: false
        description: Only this branch. Without it all branches are included.
        schema:
          type: string
          format: uuid
        example: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30

    responses:
      "200":
        description: Sales statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/GetRestaurantSalesStatsResponse"
            example:
              success: true
              message: Sales statistics retrieved successfully
              data:
                stats:
                  groupBy: day
                  from: "2024-10-01"
                  to: "2024-10-07"
                  rows:
                    - period: "2024-10-05"
                      orders: 45
                      subtotal: 13500
                      deliveryFees: 1125
                      tax: 2025
                      discounts: 400
                      total: 16250

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

