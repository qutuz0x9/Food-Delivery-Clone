    tags:
      - Restaurants

    summary: Replace the weekly operating hours schedule
    description: |
      Replaces the entire weekly operating hours schedule of the
      currently authenticated restaurant with the supplied entries,
      one per day of the week (FR-RES-006.1, FR-RES-006.2, FR-RES-006.3).

    operationId: replaceRestaurantOperatingHours

