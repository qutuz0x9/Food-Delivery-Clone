                closesAt: "23:00"
                isClosed: false
              - dayOfWeek: 1
                opensAt: "09:00"
                closesAt: "23:00"
                isClosed: false
              - dayOfWeek: 2
                opensAt: "09:00"
                closesAt: "23:00"
                isClosed: false
              - dayOfWeek: 3
                opensAt: "09:00"
                closesAt: "23:00"
                isClosed: false
              - dayOfWeek: 4
                opensAt: "09:00"
                closesAt: "23:00"
                isClosed: false
              - dayOfWeek: 5
                opensAt: "12:00"
                closesAt: "01:00"
                isClosed: false
              - dayOfWeek: 6
                opensAt: null
                closesAt: null
                isClosed: true

    responses:
      "200":
        description: Operating hours updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ReplaceOperatingHoursResponse"
