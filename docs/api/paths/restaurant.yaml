                    street: 15 Ramses St
                    building: Building 4
                    latitude: 30.0561
                    longitude: 31.2394
                  createdAt: "2023-11-10T08:00:00.000Z"
                  updatedAt: "2024-02-01T09:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  patch:
    tags:
