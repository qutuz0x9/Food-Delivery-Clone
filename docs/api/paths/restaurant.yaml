listRestaurants:
  get:
    tags:
      - Restaurants

    summary: Browse, search, and filter restaurants
    description: |
      Returns a paginated list of restaurants available to the
      customer.

      Supports free-text search by restaurant name via the `search`
      parameter, and filtering by
      city, branch availability, minimum rating, and maximum delivery
      fee, along with sorting.

      A restaurant is returned once, even if it has several branches.
      It is included when at least one of its active branches matches
      the filters, and with `cityId` set its `branches` list contains
      only the branches in that city. Only restaurants with `approved`
      status are returned. Publicly accessible; no authentication
      required.

    operationId: listRestaurants

    security: []

    parameters:
      - name: search
        in: query
        required: false
        description: Free-text search on restaurant name.
        schema:
          type: string
        example: grill

      - name: cityId
        in: query
        required: false
        description: |
          Only restaurants with an active branch in this city, from `GET /cities`.
        schema:
          type: string
          format: uuid
        example: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21

      - name: cuisine
        in: query
        required: false
        description: Only restaurants tagged with this cuisine. Names come from `GET /cuisines`.
        schema:
          type: string
        example: Grills

      - name: availabilityStatus
        in: query
        required: false
        description: |
          Only restaurants with at least one matching active branch (in the requested city, if `cityId` is set)
          whose current availability is this value.
        schema:
          type: string
          enum:
            - open
            - closed
            - busy
        example: open

      - name: minRating
        in: query
        required: false
        description: Only return restaurants with an average rating at or above this value.
        schema:
          type: number
          format: double
          minimum: 0
          maximum: 5
        example: 4

      - name: maxDeliveryFee
        in: query
        required: false
        description: Only return restaurants with a delivery fee at or below this value.
        schema:
          type: number
          format: double
          minimum: 0
        example: 30

      - name: sort
        in: query
        required: false
        description: Sort order applied to the results.
        schema:
          type: string
          enum:
            - rating_desc
            - delivery_time_asc
            - delivery_fee_asc
            - name_asc
          default: rating_desc
        example: rating_desc

      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1

      - name: limit
        in: query
        required: false
        description: Number of results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20

    responses:
      "200":
        description: Restaurants retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ListRestaurantsResponse"
            example:
              success: true
              message: Restaurants retrieved successfully
              data:
                restaurants:
                  - id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                    name: Nile Grill House
                    description: Authentic Egyptian grills and mezze.
                    logoUrl: https://cdn.example.com/restaurants/nile-grill/logo.jpg
                    coverImageUrl: https://cdn.example.com/restaurants/nile-grill/cover.jpg
                    minimumOrderAmount: 100
                    deliveryFee: 25
                    estimatedDeliveryTime: 35
                    ratingAverage: 4.5
                    ratingCount: 128
                    branches:
                      - id: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30
                        label: Ramses Branch
                        city:
                          id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                          name: Cairo
                          country: Egypt
                        street: 15 Ramses St
                        building: Building 4
                        latitude: 30.0561
                        longitude: 31.2394
                        availabilityStatus: open
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 57
                  totalPages: 3

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

