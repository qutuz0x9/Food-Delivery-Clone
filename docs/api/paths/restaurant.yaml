changePasswordRestaurant:
  post:
    tags:
      - Restaurants

    summary: Change own password

    description: |
      Changes the password of the currently authenticated restaurant. The current password must be
      supplied. Existing refresh tokens are revoked.

    operationId: changePasswordRestaurant

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/ChangePasswordRestaurantRequest"
          examples:
            valid:
              summary: Valid request
              value:
                currentPassword: StrongPassword123!
                newPassword: NewStrongPassword123!
                confirmPassword: NewStrongPassword123!
            emptyBody:
              summary: Empty body (400)
              value: {}
            missingCurrentPassword:
              summary: Missing required `currentPassword` (400)
              value:
                newPassword: NewStrongPassword123!
                confirmPassword: NewStrongPassword123!
            newPasswordTooShort:
              summary: "`newPassword` shorter than 8 characters (400)"
              value:
                currentPassword: StrongPassword123!
                newPassword: xxxxxxx
                confirmPassword: NewStrongPassword123!

    responses:
      "200":
        description: Password changed successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ChangePasswordRestaurantResponse"
            example:
              success: true
              message: Password changed successfully
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantDashboard:
