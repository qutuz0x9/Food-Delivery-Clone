                  orders:
                    today: 64
                    pending: 3
                    inProgress: 11
                    todayByStatus:
                      pending: 3
                      accepted: 4
                      preparing: 5
                      ready_for_pickup: 2
                      picked_up: 1
                      out_for_delivery: 3
                      delivered: 45
                      cancelled: 1
