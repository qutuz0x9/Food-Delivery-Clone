                  - id: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30
                    label: Ramses Branch
                    city:
                      id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                      name: Cairo
                      country: Egypt
                    street: 15 Ramses St
                    building: Building 4
                    latitude: 30.0561
                    longitude: 31.2394
