                    id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                  street: 15 Ramses St
                  building: Building 4
                  latitude: 30.0561
                  longitude: 31.2394
                  availabilityStatus: closed
                  isActive: true
                  createdAt: "2024-01-15T10:30:00.000Z"
                  updatedAt: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

loginRestaurant:
  post:
    tags:
      - Auth

    summary: Log in a restaurant
    description: |
      Authenticates a restaurant using its email and password.

      On success, issues a JWT access token in the response body and a
      refresh token in an `HttpOnly` cookie (`Set-Cookie`); the refresh
      token is never returned in the body. A
      restaurant may log in regardless of its approval `status`, but
      other endpoints may reject actions until the restaurant is
      `approved`.

      Only accounts whose `account_status` is `active` can log in.
      A `suspended`, `locked` or `inactive` account is rejected with
      `403`, and only after the email and password have been verified,
      so the response does not reveal whether an email is registered.
      Suspension is an account-level state, not a restaurant `status`.

    operationId: loginRestaurant

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/LoginRestaurantRequest"
          examples:
            valid:
              summary: Valid request
              value:
                email: contact@nilegrill.example.com
                password: StrongPassword123!
            emptyBody:
              summary: Empty body (400)
              value: {}
            missingEmail:
              summary: Missing required `email` (400)
              value:
                password: StrongPassword123!
            invalidEmail:
              summary: "`email` is not a valid email (400)"
              value:
                email: not-an-email
                password: StrongPassword123!

    responses:
      "200":
        description: Restaurant logged in successfully
        headers:
          Set-Cookie:
            description: |
              Sets the `refreshToken` cookie. It is `HttpOnly`, `Secure` and `SameSite=Strict`, so scripts cannot read it
              and the browser sends it back on its own. It is never returned in the response body.
            schema:
              type: string
            example: refreshToken=9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/LoginRestaurantResponse"
            example:
              success: true
              message: Logged in successfully
              data:
                restaurant:
                  id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                  name: Nile Grill House
                  description: Authentic Egyptian grills and mezze.
                  phoneNumber: "+201234567890"
                  email: contact@nilegrill.example.com
                  logoUrl: https://cdn.example.com/restaurants/nile-grill/logo.jpg
                  coverImageUrl: https://cdn.example.com/restaurants/nile-grill/cover.jpg
                  status: approved
                  minimumOrderAmount: 100
                  deliveryFee: 25
                  estimatedDeliveryTime: 35
                  ratingAverage: 4.5
                  ratingCount: 128
                  branches:
                    - id: 8c1f0a52-3b7d-4e9a-a6c4-2d5e7f9b1a30
                      label: Ramses Branch
                      city:
                        id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                        name: Cairo
                        country: Egypt
                      street: 15 Ramses St
                      building: Building 4
                      latitude: 30.0561
                      longitude: 31.2394
                      availabilityStatus: open
                      isActive: true
                      createdAt: "2023-11-10T08:00:00.000Z"
                      updatedAt: null
                  createdAt: "2023-11-10T08:00:00.000Z"
                  updatedAt: null
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0ZjVlNmQ3YyJ9.def456signature

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

logoutRestaurant:
  post:
    tags:
      - Auth

    summary: Log out a restaurant
    description: |
      Logs out the currently authenticated restaurant by revoking the
      refresh token, ending the session securely.

      The refresh token is read from the `refreshToken` HttpOnly cookie
      set during login — it is not accepted in the request body or as
      a query parameter. The response clears the cookie.

    operationId: logoutRestaurant

    security:
      - bearerAuth: []

    parameters:
      - name: refreshToken
        in: cookie
        required: true
        description: |
          Refresh token set by the restaurant login response. The browser sends it automatically. It is not
          accepted in the request body or as a query parameter.
        schema:
          type: string

    responses:
      "200":
        description: Restaurant logged out successfully
        headers:
          Set-Cookie:
            description: Expires the `refreshToken` cookie so the browser discards it.
            schema:
              type: string
            example: refreshToken=; Max-Age=0; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/LogoutRestaurantResponse"
            example:
              success: true
              message: Logged out successfully
              data: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

refreshRestaurant:
  post:
    tags:
      - Auth

    summary: Refresh a restaurant access token
    description: |
      Issues a new JWT access token for a restaurant whose access token has
      expired, using the `refreshToken` cookie set at login. Supports
      the session started at login.

      The refresh token is rotated on every call: the presented token
      is revoked, a new one is issued in a fresh `HttpOnly` cookie
      (`Set-Cookie`), and the new access token is returned in the
      body. If a token that was already rotated or revoked is
      presented again, the whole token chain for that session is
      revoked and the caller must log in again.

      The cookie is the credential, so no `Authorization` header is
      needed (the access token is usually expired by now). The call is
      rejected with `401` if the cookie is missing, unknown, expired
      or revoked, with `403` if the token belongs to a non-restaurant account or
      the account's `account_status` is no longer `active`.

    operationId: refreshRestaurant

    security: []

    parameters:
      - name: refreshToken
        in: cookie
        required: true
        description: |
          Refresh token set by the restaurant login response. The browser sends it automatically. It is not
          accepted in the request body or as a query parameter.
        schema:
          type: string

    responses:
      "200":
        description: Access token refreshed successfully
        headers:
          Set-Cookie:
            description: |
              Replaces the `refreshToken` cookie with the rotated token. It is `HttpOnly`, `Secure` and
              `SameSite=Strict`, and is never returned in the response body.
            schema:
              type: string
            example: refreshToken=3b2a1c0d-9e8f-4a7b-8c6d-5e4f3a2b1c0d; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/RefreshRestaurantResponse"
            example:
              success: true
              message: Access token refreshed successfully
              data:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

      "401":
        $ref: "../responses/common.yaml#/InvalidRefreshToken"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

forgotPasswordRestaurant:
  post:
    tags:
      - Auth

    summary: Request a restaurant password reset
    description: |
      Initiates the password recovery flow for a restaurant that has
      forgotten its password.

      If the supplied email matches a registered restaurant account, a
      password reset token is generated and emailed to the restaurant.
      To avoid revealing account existence, the endpoint always
      responds with the same generic success message, whether or not
      the email is registered.

    operationId: forgotPasswordRestaurant

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/ForgotPasswordRestaurantRequest"
          examples:
            valid:
              summary: Valid request
              value:
                email: contact@nilegrill.example.com
            missingEmail:
              summary: Missing required `email` (400)
              value: {}
            invalidEmail:
              summary: "`email` is not a valid email (400)"
              value:
                email: not-an-email

    responses:
      "200":
        description: Password reset request processed
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ForgotPasswordRestaurantResponse"
            example:
              success: true
              message: If an account with that email exists, a password reset link has been sent.
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

resetPasswordRestaurant:
  post:
    tags:
      - Auth

    summary: Reset a restaurant password
    description: |
      Completes the password recovery flow for a restaurant, verifying
      the restaurant's identity via the reset token before setting the
      new password.

      The token must match an unused, unexpired password reset token
      previously issued via the forgot-password request. On success,
      the token is marked as used and all existing refresh tokens for
      the account are revoked, requiring the restaurant to log in again.

    operationId: resetPasswordRestaurant

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/restaurant.yaml#/ResetPasswordRestaurantRequest"
          examples:
            valid:
              summary: Valid request
              value:
                token: 9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6
                newPassword: NewStrongPassword123!
                confirmPassword: NewStrongPassword123!
            emptyBody:
              summary: Empty body (400)
              value: {}
            missingToken:
              summary: Missing required `token` (400)
              value:
                newPassword: NewStrongPassword123!
                confirmPassword: NewStrongPassword123!
            newPasswordTooShort:
              summary: "`newPassword` shorter than 8 characters (400)"
              value:
                token: 9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6
                newPassword: xxxxxxx
                confirmPassword: NewStrongPassword123!

    responses:
      "200":
        description: Password reset successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/ResetPasswordRestaurantResponse"
            example:
              success: true
              message: Password reset successfully
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "422":
        $ref: "../responses/common.yaml#/InvalidResetToken"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

restaurantProfile:
  get:
    tags:
      - Restaurants

    summary: View own restaurant profile
    description: |
      Returns the profile information of the currently authenticated
      restaurant.

    operationId: getRestaurantProfile

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Restaurant profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/restaurant.yaml#/GetRestaurantProfileResponse"
            example:
              success: true
              message: Restaurant profile retrieved successfully
              data:
                restaurant:
                  id: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f
                  name: Nile Grill House
                  description: Authentic Egyptian grills and mezze.
                  phoneNumber: "+201234567890"
