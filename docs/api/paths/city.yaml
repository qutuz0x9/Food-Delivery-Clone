listCities:
  get:
    tags:
      - Cities

    summary: List the cities the platform operates in
    description: |
      Returns every active city. Customers pick one when saving a
      delivery address, restaurants pick one for each
      branch, and drivers pick their working city. The ids returned
      here are what the API expects as `cityId`.

      The list is a small reference table and is not paginated.
      Deactivated cities are not returned. Publicly accessible; no
      authentication required.

    operationId: listCities

    security: []

    responses:
      "200":
        description: Cities retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/city.yaml#/ListCitiesResponse"
            example:
              success: true
              message: Cities retrieved successfully
              data:
                cities:
                  - id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                  - id: 7a4c1e92-0d5b-4b3f-9e68-1f2a3b4c5d6e
                    name: Giza
                    country: Egypt
                  - id: 9b6e3d20-2f7a-4d51-8c80-3a4b5c6d7e8f
                    name: Alexandria
                    country: Egypt

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"
