    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/UpdateDriverProfileRequest"
          example:
            firstName: Omar
            licenseExpiryDate: "2028-08-30"
            workingCityId: 7a4c1e92-0d5b-4b3f-9e68-1f2a3b4c5d6e

    responses:
      "200":
