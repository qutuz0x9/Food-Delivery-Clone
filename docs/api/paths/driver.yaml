driverAvailability:
  get:
    tags:
      - Drivers

    summary: Get current availability

    description: Returns whether the driver is currently taking deliveries, together with the approval status.

    operationId: getDriverAvailability

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Availability retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/GetDriverAvailabilityResponse"
            example:
              success: true
              message: Availability retrieved successfully
              data:
                availability:
                  status: active
                  availabilityStatus: available

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  patch:
    tags:
      - Drivers

    summary: Change availability

    description: |
      Sets the driver `available`, `offline` or `on_break`. Only drivers whose approval status is
      `active` can go available (`403` otherwise). `busy` is set by the system while a delivery is in
      progress and cannot be requested; while one is in progress the driver cannot go `offline` or
      `on_break` (`409`). Only available drivers are offered new delivery requests.

    operationId: updateDriverAvailability

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/UpdateDriverAvailabilityRequest"
          example:
            availabilityStatus: offline

    responses:
      "200":
        description: Availability updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/UpdateDriverAvailabilityResponse"
            example:
              success: true
              message: Availability updated successfully
              data:
                availability:
                  status: active
                  availabilityStatus: offline

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

driverLocation:
  post:
    tags:
      - Drivers

    summary: Send current location

    description: |
      Records the driver's current position. Positions are stored as history, one per timestamp;
      sending the same `recordedAt` twice is rejected with `409`. When `recordedAt` is omitted the
      server time is used. Only drivers whose approval status is `active` can send their location.

    operationId: updateDriverLocation

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/UpdateDriverLocationRequest"
          example:
            latitude: 30.0561
            longitude: 31.2394
            heading: 90
            speed: 32.5
            recordedAt: "2024-10-05T19:05:00.000Z"

    responses:
