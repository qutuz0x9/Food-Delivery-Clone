  post:
    tags:
      - Drivers

    summary: Upload a document

    description: |
      Uploads a document for review. It starts as `submitted` until an administrator verifies or
      rejects it.

    operationId: uploadDriverDocument

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
