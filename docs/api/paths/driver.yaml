registerDriver:
  post:
    tags:
      - Auth

    summary: Register a driver

    description: |
      Creates a new driver account.

      The registration validates the supplied information, verifies that the email, phone number, national id, licence number and vehicle plate are unique (`409` if one is taken), creates the user identity, the driver profile and the driver's first vehicle. The driver starts `pending` and `offline`: until an administrator approves the account the driver can log in, edit the profile and upload documents, but cannot go available or receive delivery requests.

      The working city must be an active city (`GET /cities`).

    operationId: registerDriver

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/RegisterDriverRequest"
          example:
            email: omar.hassan@example.com
            password: StrongPassword123!
            phoneNumber: "+201001234567"
            firstName: Omar
            lastName: Hassan
            dateOfBirth: "1992-04-18"
            nationalId: "29204180101234"
            licenseNumber: LIC-559213
            licenseExpiryDate: "2027-08-30"
            workingCityId: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
            vehicle:
              vehicleType: motorcycle
              brand: Honda
              model: CB125
              color: Red
              plateNumber: ABC 1234
              manufactureYear: 2021
              insuranceExpiryDate: "2025-12-31"

    responses:
      "201":
        description: Driver account created successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/RegisterDriverResponse"
            example:
              success: true
              message: Driver account created successfully. It is now pending approval.
              data:
                driver:
                  id: e035c191-7d58-52be-9f78-c9a9351192dd
                  firstName: Omar
                  lastName: Hassan
                  email: omar.hassan@example.com
                  phoneNumber: "+201001234567"
                  dateOfBirth: "1992-04-18"
                  profileImageUrl: https://cdn.example.com/drivers/omar/profile.jpg
                  nationalId: "29204180101234"
                  licenseNumber: LIC-559213
                  licenseExpiryDate: "2027-08-30"
                  workingCity:
                    id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                  status: pending
                  availabilityStatus: offline
                  rating: 4.8
                  totalDeliveries: 312
                  vehicle:
                    id: cbc5f999-4a36-5ffc-8f59-e683862a1bb7
                    vehicleType: motorcycle
                    brand: Honda
                    model: CB125
                    color: Red
                    plateNumber: ABC 1234
                    manufactureYear: 2021
                    insuranceExpiryDate: "2025-12-31"
                    isActive: true
                    createdAt: "2024-01-10T09:00:00.000Z"
                  createdAt: "2024-01-10T09:00:00.000Z"
                  updatedAt: "2024-02-01T09:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

loginDriver:
  post:
    tags:
      - Auth

    summary: Log in a driver

    description: |
      Authenticates a driver using their email and password.

      On success, issues a JWT access token in the response body and a refresh token in an `HttpOnly` cookie (`Set-Cookie`); the refresh token is never returned in the body. A driver may log in while still `pending` approval.

      Only accounts whose `account_status` is `active` can log in. A `suspended`, `locked` or `inactive` account is rejected with `403`, and only after the email and password have been verified, so the response does not reveal whether an email is registered.

    operationId: loginDriver

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/LoginDriverRequest"
          example:
            email: omar.hassan@example.com
            password: StrongPassword123!

    responses:
      "200":
        description: Driver logged in successfully
        headers:
          Set-Cookie:
            description: |
              Sets the `refreshToken` cookie. It is `HttpOnly`, `Secure` and `SameSite=Strict`, so scripts cannot read it
              and the browser sends it back on its own. It is never returned in the response body.
            schema:
              type: string
            example: refreshToken=9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/LoginDriverResponse"
            example:
              success: true
              message: Logged in successfully
              data:
                driver:
                  id: e035c191-7d58-52be-9f78-c9a9351192dd
                  firstName: Omar
                  lastName: Hassan
                  email: omar.hassan@example.com
                  phoneNumber: "+201001234567"
                  dateOfBirth: "1992-04-18"
                  profileImageUrl: https://cdn.example.com/drivers/omar/profile.jpg
                  nationalId: "29204180101234"
                  licenseNumber: LIC-559213
                  licenseExpiryDate: "2027-08-30"
                  workingCity:
                    id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                  status: active
                  availabilityStatus: available
                  rating: 4.8
                  totalDeliveries: 312
                  vehicle:
                    id: cbc5f999-4a36-5ffc-8f59-e683862a1bb7
                    vehicleType: motorcycle
                    brand: Honda
                    model: CB125
                    color: Red
                    plateNumber: ABC 1234
                    manufactureYear: 2021
                    insuranceExpiryDate: "2025-12-31"
                    isActive: true
                    createdAt: "2024-01-10T09:00:00.000Z"
                  createdAt: "2024-01-10T09:00:00.000Z"
                  updatedAt: "2024-02-01T09:00:00.000Z"
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

logoutDriver:
  post:
    tags:
      - Auth

    summary: Log out a driver

    description: |
      Logs out the currently authenticated driver by revoking the refresh token, ending the session securely.

      The refresh token is read from the `refreshToken` HttpOnly cookie set during login - it is not accepted in the request body or as a query parameter. The response clears the cookie.

    operationId: logoutDriver

    security:
      - bearerAuth: []

    parameters:
      - name: refreshToken
        in: cookie
        required: true
        description: |
          Refresh token set by the driver login response. The browser sends it automatically. It is not
          accepted in the request body or as a query parameter.
        schema:
          type: string

    responses:
      "200":
        description: Driver logged out successfully
        headers:
          Set-Cookie:
            description: Expires the `refreshToken` cookie so the browser discards it.
            schema:
              type: string
            example: refreshToken=; Max-Age=0; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/LogoutDriverResponse"
            example:
              success: true
              message: Logged out successfully
              data: null

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

refreshDriver:
  post:
    tags:
      - Auth

    summary: Refresh a driver access token

    description: |
      Issues a new JWT access token using the `refreshToken` cookie set at login.

      The refresh token is rotated on every call: the presented token is revoked, a new one is issued in a fresh `HttpOnly` cookie, and the new access token is returned in the body. If a token that was already rotated or revoked is presented again, the whole token chain for that session is revoked and the caller must log in again.

      The cookie is the credential, so no `Authorization` header is needed. The call is rejected with `401` if the cookie is missing, unknown, expired or revoked, and with `403` if the token does not belong to a driver or the account is no longer `active`.

    operationId: refreshDriver

    security: []

    parameters:
      - name: refreshToken
        in: cookie
        required: true
        description: |
          Refresh token set by the driver login response. The browser sends it automatically. It is not
          accepted in the request body or as a query parameter.
        schema:
          type: string

    responses:
      "200":
        description: Access token refreshed successfully
        headers:
          Set-Cookie:
            description: |
              Sets the `refreshToken` cookie. It is `HttpOnly`, `Secure` and `SameSite=Strict`, so scripts cannot read it
              and the browser sends it back on its own. It is never returned in the response body.
            schema:
              type: string
            example: refreshToken=9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6; HttpOnly; Secure; SameSite=Strict
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/RefreshDriverResponse"
            example:
              success: true
              message: Access token refreshed successfully
              data:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

      "401":
        $ref: "../responses/common.yaml#/InvalidRefreshToken"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

forgotPasswordDriver:
  post:
    tags:
      - Auth

    summary: Request a driver password reset

    description: |
      Starts password recovery for a driver who forgot their password.

      If the email matches a driver account, a password reset token is generated and emailed. To avoid revealing account existence, the endpoint always responds with the same generic success message.

    operationId: forgotPasswordDriver

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/ForgotPasswordDriverRequest"
          example:
            email: omar.hassan@example.com

    responses:
      "200":
        description: Request accepted
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/ForgotPasswordDriverResponse"
            example:
              success: true
              message: If an account with that email exists, a password reset link has been sent.
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

resetPasswordDriver:
  post:
    tags:
      - Auth

    summary: Reset a driver password

    description: |
      Completes password recovery, verifying the driver's identity through the reset token before setting the new password.

      The token must match an unused, unexpired password reset token issued by the forgot-password request. On success the token is marked as used and all existing refresh tokens for the account are revoked, requiring the driver to log in again.

    operationId: resetPasswordDriver

    security: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/ResetPasswordDriverRequest"
          example:
            token: 9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6
            newPassword: NewStrongPassword123!
            confirmPassword: NewStrongPassword123!

    responses:
      "200":
        description: Password reset successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/ResetPasswordDriverResponse"
            example:
              success: true
              message: Password reset successfully. Please log in again.
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "422":
        $ref: "../responses/common.yaml#/InvalidResetToken"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

driverProfile:
  get:
    tags:
      - Drivers

    summary: View own driver profile

    description: |
      Returns the profile of the currently authenticated driver, including the working city, the
      active vehicle, the approval `status` and the current availability.

    operationId: getDriverProfile

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Driver profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/GetDriverProfileResponse"
            example:
              success: true
              message: Driver profile retrieved successfully
              data:
                driver:
                  id: e035c191-7d58-52be-9f78-c9a9351192dd
                  firstName: Omar
                  lastName: Hassan
                  email: omar.hassan@example.com
                  phoneNumber: "+201001234567"
                  dateOfBirth: "1992-04-18"
                  profileImageUrl: https://cdn.example.com/drivers/omar/profile.jpg
                  nationalId: "29204180101234"
                  licenseNumber: LIC-559213
                  licenseExpiryDate: "2027-08-30"
                  workingCity:
                    id: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21
                    name: Cairo
                    country: Egypt
                  status: active
                  availabilityStatus: available
                  rating: 4.8
                  totalDeliveries: 312
                  vehicle:
                    id: cbc5f999-4a36-5ffc-8f59-e683862a1bb7
                    vehicleType: motorcycle
                    brand: Honda
                    model: CB125
                    color: Red
                    plateNumber: ABC 1234
                    manufactureYear: 2021
