changePasswordDriver:
  post:
    tags:
      - Drivers

    summary: Change own password

    description: |
      Changes the password of the currently authenticated driver. The current password must be
      supplied and the new one confirmed. Existing refresh tokens are revoked.

    operationId: changePasswordDriver

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/ChangePasswordDriverRequest"
          example:
            currentPassword: StrongPassword123!
            newPassword: NewStrongPassword123!
            confirmPassword: NewStrongPassword123!

    responses:
      "200":
        description: Password changed successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/ChangePasswordDriverResponse"
            example:
              success: true
              message: Password changed successfully
              data: null

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

driverProfileImage:
  post:
    tags:
      - Drivers

    summary: Upload or update profile picture

    description: |
      Uploads a new profile picture for the currently authenticated driver, replacing any existing
      one.

    operationId: uploadDriverProfileImage

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - image
            properties:
              image:
                type: string
                format: binary
                description: Profile picture file (JPEG or PNG).

    responses:
      "200":
        description: Profile picture updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/UploadDriverImageResponse"
            example:
              success: true
              message: Profile picture updated successfully
              data:
                profileImageUrl: https://cdn.example.com/drivers/omar/profile.jpg

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

driverVehicles:
  get:
    tags:
      - Drivers

    summary: List own vehicles

    description: |
      Returns every vehicle the driver has registered. Exactly one is active; inactive vehicles are
      kept as history.

    operationId: listDriverVehicles

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Vehicles retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/ListDriverVehiclesResponse"
            example:
              success: true
              message: Vehicles retrieved successfully
              data:
                vehicles:
                  - id: cbc5f999-4a36-5ffc-8f59-e683862a1bb7
                    vehicleType: motorcycle
                    brand: Honda
                    model: CB125
                    color: Red
                    plateNumber: ABC 1234
                    manufactureYear: 2021
                    insuranceExpiryDate: "2025-12-31"
                    isActive: true
                    createdAt: "2024-01-10T09:00:00.000Z"
                  - id: e08edf9b-2c2b-5680-8b67-83f041d0b604
                    vehicleType: motorcycle
                    brand: Yamaha
                    model: YBR125
                    color: Red
                    plateNumber: XYZ 9876
                    manufactureYear: 2021
                    insuranceExpiryDate: "2025-12-31"
                    isActive: false
                    createdAt: "2024-01-10T09:00:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

  post:
    tags:
      - Drivers

    summary: Replace the active vehicle

    description: |
      Registers a new vehicle and makes it the driver's active one. The previously active vehicle is
      kept as an inactive record, because a driver has at most one active vehicle. The plate number
      must be unique across all vehicles (`409` otherwise).

    operationId: createDriverVehicle

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/driver.yaml#/CreateDriverVehicleRequest"
          example:
            vehicleType: car
            brand: Toyota
            model: Yaris
            color: White
            plateNumber: DEF 5678
            manufactureYear: 2023
            insuranceExpiryDate: "2026-06-30"

    responses:
      "201":
        description: Vehicle added successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/CreateDriverVehicleResponse"
            example:
              success: true
              message: Vehicle added successfully
              data:
                vehicle:
                  id: 1d7b02d0-d153-5042-8e42-c8d8554d5306
                  vehicleType: car
                  brand: Toyota
                  model: Yaris
                  color: White
                  plateNumber: DEF 5678
                  manufactureYear: 2023
                  insuranceExpiryDate: "2026-06-30"
                  isActive: true
                  createdAt: "2024-01-10T09:00:00.000Z"

      "400":
        $ref: "../responses/common.yaml#/ValidationError"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "409":
        $ref: "../responses/common.yaml#/Conflict"

      "500":
        $ref: "../responses/common.yaml#/InternalServerError"

