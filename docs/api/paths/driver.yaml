      - Drivers

    summary: List earnings

    description: |
      Returns the driver's earnings, one per delivered order, newest first. An earning is `pending`
      until a payout settles it.

    operationId: listEarnings

    security:
      - bearerAuth: []

    parameters:
      - name: status
        in: query
        required: false
        description: Only earnings with this status.
        schema:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - on_hold
            - cancelled
        example: pending
      - name: from
        in: query
        required: false
        description: Only earnings recorded on or after this day.
        schema:
          type: string
          format: date
        example: "2024-10-01"
      - name: to
        in: query
        required: false
        description: Only earnings recorded on or before this day.
        schema:
          type: string
          format: date
        example: "2024-10-31"
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        description: Number of results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20

    responses:
      "200":
        description: Earnings retrieved successfully
        content:
          application/json:
            schema:
