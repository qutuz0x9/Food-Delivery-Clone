completeDelivery:
  parameters:
    - name: assignmentId
      in: path
      required: true
      description: Unique identifier of the delivery (assignment).
      schema:
        type: string
        format: uuid
      example: a7b7de55-5c91-5d15-b152-a7f6c258fe30

  post:
    tags:
      - Drivers

    summary: Confirm delivery

    description: |
      Confirms that the order reached the customer. The order must be `out_for_delivery`. In one step
      the order moves to `delivered`, the assignment becomes `completed`, the driver's completed-
      delivery count goes up, an earning is recorded as `pending`, and the driver becomes `available`
      again (`409` if the order is in any other status). For a `cash` order the payment must already
      be `paid`, so confirm the cash first with `POST /driver/deliveries/{assignmentId}/cash-
      collection` (`409` otherwise).

    operationId: completeDelivery

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Delivery updated successfully
