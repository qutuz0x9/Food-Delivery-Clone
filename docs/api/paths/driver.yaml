    summary: List pending delivery requests

    description: |
      Returns the delivery requests currently offered to the driver: offers that are still `offered` and have not expired. A driver is offered an order once the restaurant has accepted it, and only when the pickup branch is in the driver's working city, and every eligible driver receives the same order at the same time - the first to accept wins.

