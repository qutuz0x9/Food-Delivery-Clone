                  - national_id
                  - passport
                  - insurance
                  - vehicle_registration
                  - background_check
                  - medical_certificate
                  - other
                description: Kind of document.

              file:
                type: string
                format: binary
                description: The document file (JPEG, PNG or PDF).

              expiryDate:
                type: string
                format: date
                description: When the document expires, if it does.

    responses:
      "201":
        description: Document uploaded successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/UploadDriverDocumentResponse"
            example:
              success: true
              message: Document uploaded successfully
              data:
                document:
                  id: 75488f9f-8635-539a-9d05-8e7c88db41e1
                  documentType: driver_license
                  fileUrl: https://cdn.example.com/drivers/omar/license.jpg
