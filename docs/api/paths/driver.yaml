confirmCashCollection:
  parameters:
    - name: assignmentId
      in: path
      required: true
      description: Unique identifier of the delivery (assignment).
      schema:
        type: string
        format: uuid
      example: a7b7de55-5c91-5d15-b152-a7f6c258fe30

  post:
    tags:
      - Drivers

    summary: Confirm cash collected

    description: |
      Confirms that the driver collected the order's amount in cash from the customer. The order's
      payment must use `cash` and still be `pending`, and the order must be `out_for_delivery`;
      otherwise the call is rejected with `409`. The payment becomes `paid` and `paidAt` is set. The
      driver who collected the cash is the one assigned to the order, so no separate record is kept. A
      cash delivery cannot be completed until the cash has been confirmed.

    operationId: confirmCashCollection

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Cash collection confirmed
        content:
          application/json:
            schema:
              $ref: "../schemas/driver.yaml#/ConfirmCashCollectionResponse"
            example:
              success: true
              message: Cash collection confirmed
              data:
                payment:
                  id: 9b186018-751f-5f05-89e0-896252cd46cf
                  orderId: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b
                  orderNumber: ORD-1001
                  paymentMethod: cash
                  status: paid
                  transactionReference: null
                  amount: 396
                  currency: EGP
                  paidAt: "2024-10-05T19:18:00.000Z"
                  failureReason: null
                  createdAt: "2024-10-05T18:30:30.000Z"
                  updatedAt: "2024-10-05T18:31:00.000Z"

      "401":
        $ref: "../responses/common.yaml#/Unauthorized"

      "403":
        $ref: "../responses/common.yaml#/Forbidden"

      "404":
        $ref: "../responses/common.yaml#/NotFound"

