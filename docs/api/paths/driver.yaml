    description: |
      Updates the profile of the currently authenticated driver. Only the supplied fields are updated; omitted fields remain unchanged.

      The phone number belongs to the driver's user account and the licence number to the driver, and both must stay unique (`409` otherwise). The login email and the national id cannot be changed here. A new working city must be an active city; it cannot be changed while a delivery is in progress (`409`).

