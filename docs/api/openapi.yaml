openapi: 3.0.3

info:
  title: Food Delivery System API
  version: 1.0.0
  description: |
    API documentation for the Food Delivery System.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, login, logout, and password recovery for all account types
  - name: Customers
    description: Customer profile and delivery address management
  - name: Restaurants
    description: Restaurant browsing/discovery for customers, and restaurant self-service account, profile, and availability management
  - name: Menu
    description: Restaurant menu browsing, food item search, and restaurant menu/category management

paths:
  /auth/register/customer:
    $ref: "./paths/customer.yaml#/registerCustomer"
  /auth/login/customer:
    $ref: "./paths/customer.yaml#/loginCustomer"
  /auth/logout/customer:
    $ref: "./paths/customer.yaml#/logoutCustomer"
  /auth/forgot-password/customer:
    $ref: "./paths/customer.yaml#/forgotPasswordCustomer"
  /auth/reset-password/customer:
    $ref: "./paths/customer.yaml#/resetPasswordCustomer"
  /customers/me:
    $ref: "./paths/customer.yaml#/customerProfile"
  /customers/me/change-password:
    $ref: "./paths/customer.yaml#/changePasswordCustomer"
  /customers/me/addresses:
    $ref: "./paths/customer.yaml#/deliveryAddresses"
  /customers/me/addresses/{addressId}:
    $ref: "./paths/customer.yaml#/deliveryAddress"
  /restaurants:
    $ref: "./paths/restaurant.yaml#/listRestaurants"
  /restaurants/{restaurantId}:
    $ref: "./paths/restaurant.yaml#/getRestaurant"
  /restaurants/{restaurantId}/menu:
    $ref: "./paths/restaurant.yaml#/getRestaurantMenu"
  /restaurants/auth/register:
    $ref: "./paths/restaurant.yaml#/registerRestaurant"
  /restaurants/auth/login:
    $ref: "./paths/restaurant.yaml#/loginRestaurant"
  /restaurants/auth/logout:
    $ref: "./paths/restaurant.yaml#/logoutRestaurant"
  /restaurants/auth/password-reset/request:
    $ref: "./paths/restaurant.yaml#/forgotPasswordRestaurant"
  /restaurants/auth/password-reset/confirm:
    $ref: "./paths/restaurant.yaml#/resetPasswordRestaurant"
  /restaurants/me:
    $ref: "./paths/restaurant.yaml#/restaurantProfile"
  /restaurants/me/logo:
    $ref: "./paths/restaurant.yaml#/uploadRestaurantLogo"
  /restaurants/me/operating-hours:
    $ref: "./paths/restaurant.yaml#/restaurantOperatingHours"
  /restaurants/me/operating-hours/{operatingHourId}:
    $ref: "./paths/restaurant.yaml#/restaurantOperatingHour"
  /restaurants/me/availability:
    $ref: "./paths/restaurant.yaml#/restaurantAvailability"
  /restaurants/me/categories:
    $ref: "./paths/restaurant.yaml#/restaurantMenuCategories"
  /restaurants/me/categories/{categoryId}:
    $ref: "./paths/restaurant.yaml#/restaurantMenuCategory"
  /menu-items:
    $ref: "./paths/menu.yaml#/searchMenuItems"
  /menu-items/{menuItemId}:
    $ref: "./paths/menu.yaml#/getMenuItem"

