openapi: 3.0.3

info:
  title: Food Delivery System API
  version: 1.0.0
  description: |
    API documentation for the Food Delivery System.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, login, logout, and password recovery for all account types
  - name: Cities
    description: Reference list of the cities the platform operates in (used for addresses, branches and drivers)
  - name: Customers
    description: Customer profile and delivery address management
  - name: Restaurants
    description: Restaurant browsing/discovery for customers, and restaurant self-service account, profile, and availability management
  - name: Menu
    description: Restaurant menu browsing, food item search, and restaurant menu/category management
  - name: Drivers
    description: Driver profile, vehicles, documents, availability, delivery requests, deliveries, earnings and statistics
  - name: Admin Management
    description: Administrator profile and the management of cities, customers, restaurants and drivers
  - name: Admin Operations
    description: Administrator tools for orders, payments, driver payouts and review moderation
  - name: Admin Insights
    description: Administrator dashboard, reports and the audit log

  - name: Cart
    description: The customer's shopping cart
  - name: Orders
    description: Placing, tracking and cancelling orders as a customer
  - name: Payments
    description: Payment methods and paying for an order
  - name: Restaurant Orders
    description: Incoming orders as seen and handled by the restaurant
  - name: Reviews
    description: "Restaurant and driver reviews: writing, reading and the restaurant's replies"
  - name: Promotions
    description: "A restaurant's own promotions"
