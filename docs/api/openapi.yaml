openapi: 3.0.3

info:
  title: Food Delivery System API
  version: 1.0.0
  description: |
    API documentation for the Food Delivery System.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/v1
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Customer
    description: Customer-related operations
  - name: Restaurant
    description: Restaurant browsing, search, and discovery operations
  - name: Menu
    description: Restaurant menu browsing and food item search operations

paths:
  /auth/register/customer:
    $ref: "./paths/customer.yaml#/registerCustomer"
  /auth/login/customer:
    $ref: "./paths/customer.yaml#/loginCustomer"
  /auth/logout/customer:
    $ref: "./paths/customer.yaml#/logoutCustomer"
  /auth/forgot-password/customer:
    $ref: "./paths/customer.yaml#/forgotPasswordCustomer"
  /auth/reset-password/customer:
    $ref: "./paths/customer.yaml#/resetPasswordCustomer"
  /customers/me:
    $ref: "./paths/customer.yaml#/customerProfile"
  /customers/me/change-password:
    $ref: "./paths/customer.yaml#/changePasswordCustomer"
  /customers/me/addresses:
    $ref: "./paths/customer.yaml#/deliveryAddresses"
  /customers/me/addresses/{addressId}:
    $ref: "./paths/customer.yaml#/deliveryAddress"
  /restaurants:
    $ref: "./paths/restaurant.yaml#/listRestaurants"
  /restaurants/{restaurantId}:
    $ref: "./paths/restaurant.yaml#/getRestaurant"
  /restaurants/{restaurantId}/menu:
    $ref: "./paths/restaurant.yaml#/getRestaurantMenu"
  /menu-items:
    $ref: "./paths/menu.yaml#/searchMenuItems"
  /menu-items/{menuItemId}:
    $ref: "./paths/menu.yaml#/getMenuItem"

components:
  schemas:
    RegisterCustomerRequest:
      $ref: "./schemas/customer.yaml#/RegisterCustomerRequest"
    RegisterCustomerResponse:
      $ref: "./schemas/customer.yaml#/RegisterCustomerResponse"
    LoginCustomerRequest:
      $ref: "./schemas/customer.yaml#/LoginCustomerRequest"
    LoginCustomerResponse:
      $ref: "./schemas/customer.yaml#/LoginCustomerResponse"
    LogoutCustomerResponse:
      $ref: "./schemas/customer.yaml#/LogoutCustomerResponse"
    ForgotPasswordCustomerRequest:
      $ref: "./schemas/customer.yaml#/ForgotPasswordCustomerRequest"
    ForgotPasswordCustomerResponse:
      $ref: "./schemas/customer.yaml#/ForgotPasswordCustomerResponse"
    ResetPasswordCustomerRequest:
      $ref: "./schemas/customer.yaml#/ResetPasswordCustomerRequest"
    ResetPasswordCustomerResponse:
      $ref: "./schemas/customer.yaml#/ResetPasswordCustomerResponse"
    CustomerProfile:
      $ref: "./schemas/customer.yaml#/CustomerProfile"
    GetCustomerProfileResponse:
      $ref: "./schemas/customer.yaml#/GetCustomerProfileResponse"
    UpdateCustomerProfileRequest:
      $ref: "./schemas/customer.yaml#/UpdateCustomerProfileRequest"
    UpdateCustomerProfileResponse:
      $ref: "./schemas/customer.yaml#/UpdateCustomerProfileResponse"
    ChangePasswordCustomerRequest:
      $ref: "./schemas/customer.yaml#/ChangePasswordCustomerRequest"
    ChangePasswordCustomerResponse:
      $ref: "./schemas/customer.yaml#/ChangePasswordCustomerResponse"
    DeliveryAddress:
      $ref: "./schemas/customer.yaml#/DeliveryAddress"
    ListDeliveryAddressesResponse:
      $ref: "./schemas/customer.yaml#/ListDeliveryAddressesResponse"
    CreateDeliveryAddressRequest:
      $ref: "./schemas/customer.yaml#/CreateDeliveryAddressRequest"
    CreateDeliveryAddressResponse:
      $ref: "./schemas/customer.yaml#/CreateDeliveryAddressResponse"
    GetDeliveryAddressResponse:
      $ref: "./schemas/customer.yaml#/GetDeliveryAddressResponse"
    UpdateDeliveryAddressRequest:
      $ref: "./schemas/customer.yaml#/UpdateDeliveryAddressRequest"
    UpdateDeliveryAddressResponse:
      $ref: "./schemas/customer.yaml#/UpdateDeliveryAddressResponse"
    DeleteDeliveryAddressResponse:
      $ref: "./schemas/customer.yaml#/DeleteDeliveryAddressResponse"
    Customer:
      $ref: "./schemas/customer.yaml#/Customer"
    RestaurantAddress:
      $ref: "./schemas/restaurant.yaml#/RestaurantAddress"
    OperatingHour:
      $ref: "./schemas/restaurant.yaml#/OperatingHour"
    RestaurantPromotion:
      $ref: "./schemas/restaurant.yaml#/RestaurantPromotion"
    RestaurantSummary:
      $ref: "./schemas/restaurant.yaml#/RestaurantSummary"
    Restaurant:
      $ref: "./schemas/restaurant.yaml#/Restaurant"
    ListRestaurantsResponse:
      $ref: "./schemas/restaurant.yaml#/ListRestaurantsResponse"
    GetRestaurantResponse:
      $ref: "./schemas/restaurant.yaml#/GetRestaurantResponse"
    MenuItemOptionValue:
      $ref: "./schemas/menu.yaml#/MenuItemOptionValue"
    MenuItemOptionGroup:
      $ref: "./schemas/menu.yaml#/MenuItemOptionGroup"
    MenuItemSummary:
      $ref: "./schemas/menu.yaml#/MenuItemSummary"
    MenuItemSearchResult:
      $ref: "./schemas/menu.yaml#/MenuItemSearchResult"
    MenuItem:
      $ref: "./schemas/menu.yaml#/MenuItem"
    MenuCategory:
      $ref: "./schemas/menu.yaml#/MenuCategory"
    GetRestaurantMenuResponse:
      $ref: "./schemas/menu.yaml#/GetRestaurantMenuResponse"
    GetMenuItemResponse:
      $ref: "./schemas/menu.yaml#/GetMenuItemResponse"
    SearchMenuItemsResponse:
      $ref: "./schemas/menu.yaml#/SearchMenuItemsResponse"
    PaginationMeta:
      $ref: "./schemas/common.yaml#/PaginationMeta"
    ErrorResponse:
      $ref: "./schemas/common.yaml#/ErrorResponse"
    ValidationErrorResponse:
      $ref: "./schemas/common.yaml#/ValidationErrorResponse"

  responses:
    ValidationError:
      $ref: "./responses/common.yaml#/ValidationError"
    Conflict:
      $ref: "./responses/common.yaml#/Conflict"
    Unauthorized:
      $ref: "./responses/common.yaml#/Unauthorized"
    InvalidResetToken:
      $ref: "./responses/common.yaml#/InvalidResetToken"
    NotFound:
      $ref: "./responses/common.yaml#/NotFound"
    InternalServerError:
      $ref: "./responses/common.yaml#/InternalServerError"

  securitySchemes:
    bearerAuth:
      $ref: "./security/common.yaml#/bearerAuth"
