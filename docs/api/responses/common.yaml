ValidationError:
  description: Validation error
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ValidationErrorResponse"
      examples:
        invalidFields:
          summary: Invalid field values
          value:
            success: false
            message: Validation failed
            error:
              code: VALIDATION_ERROR
              fields:
                email: Invalid email address
                password: Password must contain at least 8 characters
        missingRequiredFields:
          summary: Required fields missing (e.g. last name not provided)
          value:
            success: false
            message: Validation failed
            error:
              code: VALIDATION_ERROR
              fields:
                lastName: Last name is required
                firstName: First name is required

Conflict:
  description: Conflict with the current state of the resource (e.g. duplicate email)
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
      example:
        success: false
        message: Email address is already registered
        error:
          code: EMAIL_ALREADY_EXISTS

InternalServerError:
  description: Internal server error
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
      example:
        success: false
        message: An unexpected error occurred
        error:
          code: INTERNAL_SERVER_ERROR

Unauthorized:
  description: Authentication failed or credentials/token are invalid
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
      example:
        success: false
        message: Invalid email or password
        error:
          code: INVALID_CREDENTIALS

InvalidResetToken:
  description: Password reset token is invalid, expired, or already used
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
      example:
        success: false
        message: This password reset link is invalid or has expired
        error:
          code: INVALID_OR_EXPIRED_TOKEN

NotFound:
  description: The requested resource does not exist or does not belong to the authenticated user
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
      example:
        success: false
        message: Delivery address not found
        error:
          code: DELIVERY_ADDRESS_NOT_FOUND
