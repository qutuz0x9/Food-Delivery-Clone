      description: Last day of the report.
      example: "2024-10-07"

    rows:
      type: array
      items:
        type: object
        required:
          - period
          - orders
          - delivered
          - cancelled
          - rejected
        properties:
          period:
            type: string
            description: Start of the group (day, week or month).
            example: "2024-10-05"

          orders:
            type: integer
            minimum: 0
            description: Orders placed.
            example: 342

          delivered:
            type: integer
            minimum: 0
            description: Delivered.
            example: 270

          cancelled:
            type: integer
            minimum: 0
            description: Cancelled.
            example: 14

          rejected:
            type: integer
            minimum: 0
            description: Rejected.
            example: 8

SalesReport:
  type: object
  required:
    - groupBy
    - from
    - to
    - rows
  properties:
    groupBy:
      type: string
      enum:
        - day
        - week
        - month
      description: How rows are grouped.
      example: day

    from:
      type: string
      format: date
      description: First day of the report.
      example: "2024-10-01"

    to:
      type: string
      format: date
      description: Last day of the report.
      example: "2024-10-07"

    rows:
      type: array
      description: Only delivered orders are counted.
      items:
        type: object
        required:
          - period
          - orders
          - subtotal
          - deliveryFees
          - tax
          - discounts
          - total
        properties:
          period:
            type: string
            description: Start of the group (day, week or month).
            example: "2024-10-05"

          orders:
            type: integer
            minimum: 0
            description: Delivered orders.
            example: 270

          subtotal:
            type: number
            format: double
            minimum: 0
            description: Sum of subtotals.
            example: 81000

          deliveryFees:
            type: number
            format: double
            minimum: 0
            description: Sum of delivery fees.
            example: 6750

          tax:
            type: number
            format: double
            minimum: 0
            description: Sum of tax.
            example: 12150

          discounts:
            type: number
            format: double
            minimum: 0
            description: Sum of discounts.
            example: 3200

          total:
            type: number
            format: double
            minimum: 0
            description: Sum of order totals.
            example: 96700

