      minLength: 1
      description: First name.
      example: Sara

    lastName:
      type: string
      minLength: 1
      description: Last name.
      example: Mostafa

    phoneNumber:
      type: string
      description: Phone number. Must stay unique across all accounts.
      example: "+201112223334"

    profileImageUrl:
      type: string
      format: uri
      nullable: true
      description: Profile picture URL.
      example: https://cdn.example.com/admins/sara.jpg

UpdateAdminProfileResponse:
  type: object
  required:
