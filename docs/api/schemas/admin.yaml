        - admin
      properties:
        admin:
          $ref: "#/AdminProfile"

AdminCity:
  type: object
  required:
    - id
    - name
    - country
    - isActive
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique city identifier.
      example: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21

    name:
      type: string
      maxLength: 100
      description: City name.
      example: Cairo

    country:
      type: string
      maxLength: 100
      description: Country.
      example: Egypt

    isActive:
      type: boolean
      description: |
        Whether the city is in service. Inactive cities are hidden from `GET /cities` and cannot be
        chosen.
      example: true

    createdAt:
      type: string
      format: date-time
      description: When the city was added.
      example: "2024-01-01T00:00:00.000Z"

ListAdminCitiesResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Cities retrieved successfully

    data:
      type: object
      required:
        - cities
      properties:
        cities:
          type: array
          items:
            $ref: "#/AdminCity"

CreateCityRequest:
  type: object
  required:
    - name
    - country
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: City name.
      example: Alexandria

    country:
      type: string
      minLength: 1
      maxLength: 100
      description: Country.
      example: Egypt

CreateCityResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
