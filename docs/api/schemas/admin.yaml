    - firstName
    - lastName
    - email
    - phoneNumber
    - accountStatus
    - emailVerified
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Customer identifier.
      example: 7d8c5e9a-8b2f-4c1a-9d72-123456789abc

    userId:
      type: string
      format: uuid
      description: The customer's user account.
      example: 1f89c291-94ac-59fd-a6b3-23578af30f0f

    firstName:
      type: string
      description: First name.
      example: John

    lastName:
      type: string
      description: Last name.
      example: Doe

    email:
      type: string
      format: email
      description: Login email.
      example: john@example.com

    phoneNumber:
      type: string
      description: Phone number.
      example: "+201234567890"

    accountStatus:
      $ref: "#/AccountStatus"

    emailVerified:
      type: boolean
      description: True once the email has been verified.
      example: true

    createdAt:
      type: string
      format: date-time
      description: When the account was created.
      example: "2024-01-15T10:30:00.000Z"

AdminCustomer:
  allOf:
