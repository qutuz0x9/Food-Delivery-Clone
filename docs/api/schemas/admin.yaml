        - availableNow
      properties:
        pending:
          type: integer
          minimum: 0
          example: 6

        active:
          type: integer
          minimum: 0
          example: 210

        inactive:
          type: integer
          minimum: 0
          example: 12

        availableNow:
          type: integer
          minimum: 0
          example: 87

    orders:
      type: object
      required:
        - today
        - inProgress
        - todayByStatus
      properties:
        today:
          type: integer
          minimum: 0
          example: 342

        inProgress:
          type: integer
          minimum: 0
          example: 58

        todayByStatus:
          type: object
