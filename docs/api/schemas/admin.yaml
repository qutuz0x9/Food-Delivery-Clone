    - type: object
      required:
        - orderCount
        - deliveryAddresses
      properties:
        profileImageUrl:
          type: string
          format: uri
          nullable: true
          description: Profile picture.
          example: null

        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Date of birth.
          example: "1990-05-20"

        gender:
          type: string
          nullable: true
          enum:
            - male
            - female
          description: Gender.
          example: male

        orderCount:
          type: integer
          minimum: 0
          description: Orders the customer has placed.
          example: 14

        deliveryAddresses:
          type: array
          description: The customer's saved delivery addresses.
          items:
            $ref: "./customer.yaml#/DeliveryAddress"

        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Last profile change.
          example: "2024-02-01T09:00:00.000Z"

