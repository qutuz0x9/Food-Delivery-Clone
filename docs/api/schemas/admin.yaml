AdminDriverSummary:
  type: object
  required:
    - id
    - userId
    - firstName
    - lastName
    - email
    - phoneNumber
    - workingCity
    - status
    - availabilityStatus
    - accountStatus
    - rating
    - totalDeliveries
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Driver identifier.
      example: e035c191-7d58-52be-9f78-c9a9351192dd

    userId:
      type: string
      format: uuid
      description: The driver's user account.
      example: 0611da80-d0d0-535a-8bf9-6503cef2f460

    firstName:
      type: string
      maxLength: 100
      description: First name.
      example: Omar

    lastName:
      type: string
      maxLength: 100
      description: Last name.
      example: Hassan

    email:
      type: string
      format: email
      description: Login email.
      example: omar.hassan@example.com

    phoneNumber:
      type: string
      description: Phone number.
      example: "+201001234567"

    workingCity:
      $ref: "./city.yaml#/City"

    status:
      type: string
      enum:
        - pending
        - active
        - inactive
      description: Approval state.
      example: active

    availabilityStatus:
      type: string
      enum:
        - available
        - busy
        - offline
        - on_break
      description: Whether the driver is taking deliveries.
      example: available

    accountStatus:
      $ref: "#/AccountStatus"

    rating:
      type: number
      format: double
      minimum: 0
      maximum: 5
      description: Average review rating (0-5), a cached value.
      example: 4.8

    totalDeliveries:
      type: integer
      minimum: 0
      description: Completed deliveries, a cached value.
      example: 312

    createdAt:
      type: string
      format: date-time
      description: When the account was created.
      example: "2024-01-10T09:00:00.000Z"

AdminDriver:
  allOf:
    - $ref: "#/AdminDriverSummary"
    - type: object
      required:
        - dateOfBirth
        - nationalId
        - licenseNumber
        - licenseExpiryDate
        - documents
      properties:
        dateOfBirth:
          type: string
          format: date
          description: Date of birth.
          example: "1992-04-18"

        profileImageUrl:
          type: string
          format: uri
          nullable: true
          description: Profile picture.
          example: https://cdn.example.com/drivers/omar/profile.jpg

        nationalId:
          type: string
          maxLength: 30
          description: National identity number.
          example: "29204180101234"

        licenseNumber:
          type: string
          maxLength: 50
          description: Driving licence number.
          example: LIC-559213

        licenseExpiryDate:
          type: string
          format: date
          description: When the licence expires.
          example: "2027-08-30"

        vehicle:
          type: object
          nullable: true
          description: The driver's active vehicle.
          allOf:
            - $ref: "./driver.yaml#/DriverVehicle"

        documents:
          type: array
          description: Every document the driver uploaded.
          items:
            $ref: "./driver.yaml#/DriverDocument"

        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Last profile change.
          example: "2024-02-01T09:00:00.000Z"

