    - publishedAt
  properties:
    id:
      type: string
      format: uuid
      description: Review identifier.
      example: 9cbcd5fc-2edf-52da-9921-c8c55d3d05a1

    orderId:
      type: string
      format: uuid
      description: Order reviewed.
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

    orderNumber:
      type: string
      description: Order number.
      example: ORD-1001

    customer:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: 7d8c5e9a-8b2f-4c1a-9d72-123456789abc

        name:
          type: string
          example: John Doe

    restaurant:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f

        name:
          type: string
          example: Nile Grill House

    rating:
      type: integer
      minimum: 1
      maximum: 5
      description: Rating from 1 to 5.
      example: 4

    title:
      type: string
      nullable: true
      description: Review title.
      example: Great grills

    comment:
      type: string
      nullable: true
      description: Review text.
      example: Tasty food, a bit late.

    status:
      $ref: "#/ReviewStatus"

    isEdited:
      type: boolean
      description: Whether the customer edited the review.
      example: false

    images:
      type: array
      description: Photos attached to the review.
      items:
        type: string
        format: uri
        example: https://cdn.example.com/reviews/1/photo1.jpg

    reply:
      type: object
      nullable: true
      description: The restaurant's single reply, if any.
      required:
        - reply
        - createdAt
        - updatedAt
      properties:
        reply:
          type: string
          example: Thank you, we are working on delivery times.

        createdAt:
          type: string
          format: date-time
          example: "2024-10-06T09:00:00.000Z"

        updatedAt:
          type: string
          format: date-time
          example: "2024-10-06T09:00:00.000Z"

    createdAt:
      type: string
      format: date-time
      description: When the review was written.
      example: "2024-10-05T20:00:00.000Z"

    updatedAt:
      type: string
      format: date-time
      description: Last change.
      example: "2024-10-05T20:00:00.000Z"

    publishedAt:
      type: string
      format: date-time
      nullable: true
      description: When the review was published.
      example: null

