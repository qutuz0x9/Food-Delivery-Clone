AccountStatus:
  type: string
  enum:
    - active
    - inactive
    - locked
    - suspended
  description: Login state of a user account. Only `active` accounts can log in.
  example: active

ReviewStatus:
  type: string
  enum:
    - pending
    - published
    - hidden
    - deleted
  description: Moderation state of a review. Only `published` reviews are shown to the public.
  example: published

UpdateAccountStatusRequest:
  type: object
  required:
    - accountStatus
  properties:
    accountStatus:
      $ref: "#/AccountStatus"

AdminProfile:
  type: object
  required:
    - id
    - firstName
    - lastName
    - email
    - phoneNumber
    - profileImageUrl
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique administrator identifier.
      example: 383e47af-52e5-51be-b66f-057bcb14629c

    firstName:
      type: string
      description: First name.
      example: Sara

    lastName:
      type: string
      description: Last name.
      example: Mostafa

    email:
      type: string
      format: email
      description: Login email of the administrator's user account.
      example: sara.mostafa@example.com

    phoneNumber:
      type: string
      description: Phone number of the user account.
      example: "+201112223334"

    profileImageUrl:
      type: string
      format: uri
      nullable: true
      description: Profile picture.
      example: null

    createdAt:
      type: string
      format: date-time
      description: When the account was created.
      example: "2024-01-02T08:00:00.000Z"

    updatedAt:
      type: string
      format: date-time
      nullable: true
      description: Last profile change.
      example: null

LoginAdminRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: Account email.
      example: sara.mostafa@example.com

    password:
      type: string
      format: password
      description: Account password.
      example: StrongPassword123!

LoginAdminResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Logged in successfully

    data:
      type: object
      required:
        - admin
        - accessToken
      properties:
        admin:
          $ref: "#/AdminProfile"

        accessToken:
          type: string
          description: JWT access token used to authenticate subsequent requests.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

RefreshAdminResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Access token refreshed successfully

    data:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: New JWT access token. The rotated refresh token is sent only in the `Set-Cookie` header.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

LogoutAdminResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Logged out successfully

    data:
      type: object
      nullable: true

ForgotPasswordAdminRequest:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      format: email
      description: Email of the account to recover.
      example: sara.mostafa@example.com

ForgotPasswordAdminResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: If an account with that email exists, a password reset link has been sent.

    data:
      type: object
      nullable: true

ResetPasswordAdminRequest:
  type: object
  required:
    - token
    - newPassword
    - confirmPassword
  properties:
    token:
      type: string
      description: Password reset token received via email.
      example: 9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6

    newPassword:
      type: string
      format: password
      minLength: 8
      description: New account password.
      example: NewStrongPassword123!

    confirmPassword:
      type: string
      format: password
      minLength: 8
      description: Must match `newPassword` exactly.
      example: NewStrongPassword123!

ResetPasswordAdminResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Password reset successfully. Please log in again.

    data:
      type: object
      nullable: true

ChangePasswordAdminRequest:
  type: object
  required:
    - currentPassword
    - newPassword
    - confirmPassword
  properties:
    currentPassword:
      type: string
      format: password
      description: The administrator's current password.
      example: StrongPassword123!

    newPassword:
      type: string
      format: password
      minLength: 8
      description: New account password.
      example: NewStrongPassword123!

    confirmPassword:
      type: string
      format: password
      minLength: 8
      description: Must match `newPassword` exactly.
      example: NewStrongPassword123!

ChangePasswordAdminResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Password changed successfully

    data:
      type: object
      nullable: true

GetAdminProfileResponse:
