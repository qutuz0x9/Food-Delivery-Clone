    action:
      type: string
      description: What was done.
      example: order.status.update

    entityName:
      type: string
      description: Kind of record that was changed.
      example: orders

    entityId:
      type: string
      format: uuid
      nullable: true
      description: The record that was changed.
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

    oldValue:
      type: object
      nullable: true
      description: Values before the change.
      additionalProperties: true

    newValue:
      type: object
      nullable: true
      description: Values after the change.
      additionalProperties: true

    ipAddress:
      type: string
      description: Client IP address.
      example: 203.0.113.24

    requestId:
      type: string
      nullable: true
      description: Correlation id of the request.
      example: req_7f3a9c

    userAgent:
      type: string
      description: Client user agent.
      example: Mozilla/5.0

    status:
      type: string
      nullable: true
      description: Outcome of the action.
      example: success

    createdAt:
      type: string
      format: date-time
      description: When the action happened.
      example: "2024-10-05T19:40:00.000Z"

