    message:
      type: string
      example: City created successfully

    data:
      type: object
      required:
        - city
      properties:
        city:
          $ref: "#/AdminCity"

UpdateCityRequest:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: City name.
      example: Alexandria

    country:
      type: string
      minLength: 1
      maxLength: 100
      description: Country.
      example: Egypt

    isActive:
      type: boolean
      description: Set to `false` to take the city out of service.
      example: true

UpdateCityResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: City updated successfully

    data:
      type: object
      required:
        - city
      properties:
        city:
          $ref: "#/AdminCity"

AdminCustomerSummary:
  type: object
  required:
    - id
