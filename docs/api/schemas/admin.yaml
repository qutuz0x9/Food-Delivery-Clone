          minimum: 0
          example: 1198

    restaurants:
      type: object
      required:
        - pending
        - approved
        - rejected
        - activeBranches
      properties:
        pending:
          type: integer
          minimum: 0
          example: 4

        approved:
          type: integer
          minimum: 0
          example: 63

        rejected:
          type: integer
          minimum: 0
          example: 2

        activeBranches:
          type: integer
          minimum: 0
          example: 91

    drivers:
