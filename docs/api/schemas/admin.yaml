AdminRestaurantSummary:
  type: object
  required:
    - id
    - userId
    - name
    - email
    - phoneNumber
    - status
    - accountStatus
    - branchCount
    - ratingAverage
    - ratingCount
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Restaurant identifier.
      example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f

    userId:
      type: string
      format: uuid
      description: The restaurant's user account.
      example: 07ec6df2-5235-52c2-9fcb-192cf74ff85c

    name:
      type: string
      maxLength: 150
      description: Restaurant name.
      example: Nile Grill House

    email:
      type: string
      format: email
      description: Login email of the restaurant's user account.
      example: contact@nilegrill.example.com

    phoneNumber:
      type: string
      description: Phone number of the user account.
      example: "+201234567890"

    status:
      type: string
      enum:
        - pending
        - approved
        - rejected
      description: Registration approval state.
      example: approved

    accountStatus:
      $ref: "#/AccountStatus"

    branchCount:
      type: integer
      minimum: 0
      description: Number of branches, active or not.
      example: 2

    ratingAverage:
      type: number
      format: double
      minimum: 0
      maximum: 5
      description: Average rating (0-5), a cached value.
      example: 4.5

    ratingCount:
      type: integer
      minimum: 0
      description: Number of ratings, a cached value.
      example: 128

    createdAt:
      type: string
      format: date-time
      description: When the account was created.
      example: "2023-11-10T08:00:00.000Z"

AdminRestaurant:
  allOf:
    - $ref: "#/AdminRestaurantSummary"
    - type: object
      required:
        - minimumOrderAmount
        - deliveryFee
        - branches
      properties:
        description:
          type: string
          nullable: true
          description: Description.
          example: Authentic Egyptian grills and mezze.

        logoUrl:
          type: string
          format: uri
          nullable: true
          description: Logo.
          example: https://cdn.example.com/restaurants/nile-grill/logo.jpg

        coverImageUrl:
          type: string
          format: uri
          nullable: true
          description: Cover image.
          example: https://cdn.example.com/restaurants/nile-grill/cover.jpg

        minimumOrderAmount:
          type: number
          format: double
          minimum: 0
          description: Minimum order amount.
          example: 100

        deliveryFee:
          type: number
          format: double
          minimum: 0
          description: Delivery fee.
          example: 25

        estimatedDeliveryTime:
          type: integer
          nullable: true
          minimum: 0
          description: Estimated delivery time in minutes.
          example: 35

        branches:
          type: array
          description: All branches, including inactive ones.
          items:
            $ref: "./restaurant.yaml#/RestaurantBranch"

        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Last change.
          example: "2024-02-01T09:00:00.000Z"

