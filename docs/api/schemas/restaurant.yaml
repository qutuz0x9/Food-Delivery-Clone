RestaurantDashboard:
  type: object
  description: Headline numbers for the restaurant, across all branches or one branch when `branchId` is given.
  required:
    - orders
    - revenue
    - rating
    - branches
  properties:
    orders:
      type: object
      required:
        - today
        - pending
        - inProgress
        - todayByStatus
      properties:
        today:
          type: integer
          minimum: 0
          example: 64

        pending:
          type: integer
          minimum: 0
          description: Orders waiting to be accepted.
          example: 3

        inProgress:
          type: integer
          minimum: 0
          description: Accepted, preparing or ready for pickup.
          example: 11

        todayByStatus:
          type: object
          description: Today's orders by status.
          additionalProperties:
            type: integer
            minimum: 0
          example:
            pending: 3
            accepted: 4
            preparing: 5
            ready_for_pickup: 2
            picked_up: 1
            out_for_delivery: 3
            delivered: 45
            cancelled: 1
            rejected: 0

    revenue:
      type: object
      description: Sum of `totalAmount` of delivered orders.
      required:
        - today
        - last7Days
        - last30Days
      properties:
        today:
          type: number
          format: double
          minimum: 0
          example: 9800

        last7Days:
          type: number
          format: double
          minimum: 0
          example: 61200

        last30Days:
          type: number
          format: double
          minimum: 0
          example: 248000

    rating:
      type: object
      required:
        - average
        - count
      properties:
        average:
          type: number
          format: double
          minimum: 0
          maximum: 5
          example: 4.5

        count:
          type: integer
          minimum: 0
          example: 128

    branches:
      type: object
      required:
        - total
        - active
        - open
      properties:
        total:
          type: integer
          minimum: 0
          example: 3

        active:
          type: integer
          minimum: 0
          example: 3

        open:
          type: integer
          minimum: 0
          description: Active branches that are open right now.
          example: 2

