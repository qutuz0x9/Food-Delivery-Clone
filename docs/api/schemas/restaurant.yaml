RestaurantSalesStats:
  type: object
  required:
    - groupBy
    - from
    - to
    - rows
  properties:
    groupBy:
      type: string
      enum:
        - day
        - week
        - month
      description: How rows are grouped.
      example: day

    from:
      type: string
      format: date
      description: First day.
      example: "2024-10-01"

    to:
      type: string
      format: date
      description: Last day.
      example: "2024-10-07"

    rows:
      type: array
      description: Only delivered orders are counted.
      items:
        type: object
        required:
          - period
          - orders
          - subtotal
          - deliveryFees
          - tax
          - discounts
          - total
        properties:
          period:
            type: string
            description: Start of the group.
            example: "2024-10-05"

          orders:
            type: integer
            minimum: 0
            description: Delivered orders.
            example: 45

          subtotal:
            type: number
            format: double
            minimum: 0
            example: 13500

          deliveryFees:
            type: number
            format: double
            minimum: 0
            example: 1125

          tax:
            type: number
            format: double
            minimum: 0
            example: 2025

          discounts:
            type: number
            format: double
            minimum: 0
            example: 400

          total:
            type: number
            format: double
            minimum: 0
            example: 16250

GetRestaurantSalesStatsResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Sales statistics retrieved successfully

    data:
      type: object
      required:
        - stats
      properties:
        stats:
          $ref: "#/RestaurantSalesStats"

RestaurantOrderStats:
  type: object
