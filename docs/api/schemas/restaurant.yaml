Cuisine:
  type: object
  description: |
    A cuisine tag describing what the restaurant serves. These are separate from the menu categories
    that organise the menu.
  required:
    - id
    - name
    - isActive
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique cuisine tag identifier.
      example: be039fa3-0f24-5823-9892-d9f50ffb70ed

    name:
      type: string
      maxLength: 150
      description: Tag shown to customers, such as "Grills".
      example: Grills

    isActive:
      type: boolean
      description: Whether customers see the tag.
      example: true

    createdAt:
      type: string
      format: date-time
      description: When the tag was created.
      example: "2023-11-10T08:30:00.000Z"

    updatedAt:
      type: string
      format: date-time
      nullable: true
      description: Last change.
      example: null

