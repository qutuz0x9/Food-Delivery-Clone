RestaurantAddress:
  type: object
  required:
    - country
    - city
    - street
    - latitude
    - longitude
  properties:
    country:
      type: string
      description: Country where the restaurant is located.
      example: Egypt

    city:
      type: string
      description: City where the restaurant is located.
      example: Cairo

    street:
      type: string
      description: Street address.
      example: 15 Ramses St

    building:
      type: string
      nullable: true
      description: Building name or number.
      example: Building 4

    latitude:
      type: number
      format: double
      description: Latitude coordinate of the restaurant.
      example: 30.0561

    longitude:
      type: number
      format: double
      description: Longitude coordinate of the restaurant.
      example: 31.2394

OperatingHour:
  type: object
  required:
    - dayOfWeek
    - isClosed
  properties:
    dayOfWeek:
      type: integer
      minimum: 0
      maximum: 6
      description: Day of the week (0 = Sunday, 6 = Saturday).
      example: 1

    opensAt:
      type: string
      nullable: true
      description: Opening time on this day, in `HH:mm` format.
      example: "09:00"

    closesAt:
      type: string
      nullable: true
      description: Closing time on this day, in `HH:mm` format.
      example: "23:00"

    isClosed:
      type: boolean
      description: Whether the restaurant is closed all day on this day.
      example: false

RestaurantPromotion:
  type: object
  required:
    - id
    - title
    - discountType
    - discountValue
    - startsAt
    - endsAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique promotion identifier.
      example: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f

    title:
      type: string
      description: Promotion title.
      example: 20% off orders over 200 EGP

    discountType:
      type: string
      enum:
        - percentage
        - fixed
        - free_shipping
        - buy_one_get_one
      description: Type of discount applied by the promotion.
      example: percentage

    discountValue:
      type: number
      format: double
      description: Discount value (percentage or fixed amount, depending on `discountType`).
      example: 20

    startsAt:
      type: string
      format: date-time
      description: Timestamp when the promotion becomes active.
      example: "2024-06-01T00:00:00.000Z"

    endsAt:
      type: string
      format: date-time
      description: Timestamp when the promotion expires.
      example: "2024-06-30T23:59:59.000Z"

RestaurantSummary:
  type: object
  required:
    - id
    - name
    - availabilityStatus
    - minimumOrderAmount
    - deliveryFee
    - ratingAverage
    - ratingCount
    - address
  properties:
    id:
      type: string
      format: uuid
      description: Unique restaurant identifier.
      example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f

    name:
      type: string
      description: Restaurant name.
      example: Nile Grill House

    description:
      type: string
      nullable: true
      description: Short description of the restaurant.
      example: Authentic Egyptian grills and mezze.

    logoUrl:
      type: string
      format: uri
      nullable: true
      description: URL of the restaurant's logo.
      example: https://cdn.example.com/restaurants/nile-grill/logo.jpg

    coverImageUrl:
      type: string
      format: uri
      nullable: true
      description: URL of the restaurant's cover image.
      example: https://cdn.example.com/restaurants/nile-grill/cover.jpg

    availabilityStatus:
      type: string
      enum:
        - open
        - closed
        - busy
      description: Current real-time availability of the restaurant.
      example: open

    minimumOrderAmount:
      type: number
      format: double
      description: Minimum order amount accepted by the restaurant.
      example: 100

    deliveryFee:
      type: number
      format: double
      description: Delivery fee charged by the restaurant.
      example: 25

    estimatedDeliveryTime:
      type: integer
      nullable: true
      description: Estimated delivery time, in minutes.
      example: 35

    ratingAverage:
      type: number
      format: double
      description: Average customer rating (0-5).
      example: 4.5

    ratingCount:
      type: integer
      description: Total number of ratings received.
      example: 128

    address:
      $ref: "#/RestaurantAddress"

Restaurant:
  type: object
  required:
    - id
    - name
    - availabilityStatus
    - minimumOrderAmount
    - deliveryFee
    - ratingAverage
    - ratingCount
    - address
    - operatingHours
    - activePromotions
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique restaurant identifier.
      example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f

    name:
      type: string
      description: Restaurant name.
      example: Nile Grill House

    description:
      type: string
      nullable: true
      description: Description of the restaurant.
      example: Authentic Egyptian grills and mezze.

    phoneNumber:
      type: string
      nullable: true
      description: Restaurant contact phone number.
      example: "+201234567890"

    email:
      type: string
      format: email
      nullable: true
      description: Restaurant contact email address.
      example: contact@nilegrill.example.com

    logoUrl:
      type: string
      format: uri
      nullable: true
      description: URL of the restaurant's logo.
      example: https://cdn.example.com/restaurants/nile-grill/logo.jpg

    coverImageUrl:
      type: string
      format: uri
      nullable: true
      description: URL of the restaurant's cover image.
      example: https://cdn.example.com/restaurants/nile-grill/cover.jpg

    availabilityStatus:
      type: string
      enum:
        - open
        - closed
        - busy
      description: Current real-time availability of the restaurant.
      example: open

    minimumOrderAmount:
      type: number
      format: double
      description: Minimum order amount accepted by the restaurant.
      example: 100

    deliveryFee:
      type: number
      format: double
      description: Delivery fee charged by the restaurant.
      example: 25

    estimatedDeliveryTime:
      type: integer
      nullable: true
      description: Estimated delivery time, in minutes.
      example: 35

    ratingAverage:
      type: number
      format: double
      description: Average customer rating (0-5).
      example: 4.5

    ratingCount:
      type: integer
      description: Total number of ratings received.
      example: 128

    address:
      $ref: "#/RestaurantAddress"

    operatingHours:
      type: array
      description: Weekly operating hours, one entry per day of the week.
      items:
        $ref: "#/OperatingHour"

    activePromotions:
      type: array
      description: Promotions currently active for this restaurant.
      items:
        $ref: "#/RestaurantPromotion"

    createdAt:
      type: string
      format: date-time
      description: Timestamp when the restaurant joined the platform.
      example: "2023-11-10T08:00:00.000Z"

ListRestaurantsResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Restaurants retrieved successfully

    data:
      type: object
      required:
        - restaurants
        - pagination
      properties:
        restaurants:
          type: array
          items:
            $ref: "#/RestaurantSummary"

        pagination:
          $ref: "../schemas/common.yaml#/PaginationMeta"

GetRestaurantResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Restaurant details retrieved successfully

    data:
      type: object
      required:
        - restaurant
      properties:
        restaurant:
          $ref: "#/Restaurant"
