      format: double
      minimum: 0
      description: Base price.
      example: 150

    preparationTime:
      type: integer
      nullable: true
      minimum: 0
      description: Preparation time in minutes.
      example: 25

    isActive:
      type: boolean
      description: Set to `false` to take the item off the menu.
      example: true

