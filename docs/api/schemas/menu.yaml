    updatedAt:
      type: string
      format: date-time
      description: Last change.
      example: "2024-02-01T09:00:00.000Z"

CreateMenuItemRequest:
  type: object
  required:
    - categoryId
    - name
    - basePrice
  properties:
    categoryId:
      type: string
      format: uuid
      description: One of the restaurant's active menu categories.
      example: cf8547b5-aef4-5866-86ac-b39dd6c061cb

    name:
      type: string
      minLength: 1
      maxLength: 150
      description: Item name. Must be unique among the restaurant's active items.
      example: Mixed Grill

    description:
      type: string
      nullable: true
      description: Description.
      example: Kofta, kebab and grilled chicken with rice.

    basePrice:
      type: number
      format: double
      minimum: 0
      description: Base price.
      example: 150

    preparationTime:
      type: integer
      nullable: true
      minimum: 0
      description: Preparation time in minutes.
      example: 25

    isAvailable:
      type: boolean
      default: true
      description: Whether the item can be ordered.
      example: true

    isActive:
      type: boolean
      default: true
      description: Whether the item is on the menu.
      example: true

UpdateMenuItemRequest:
  type: object
  minProperties: 1
  properties:
