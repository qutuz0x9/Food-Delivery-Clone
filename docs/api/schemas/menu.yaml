RestaurantMenuItemSummary:
  type: object
  required:
    - id
    - categoryId
    - categoryName
    - name
    - basePrice
    - isAvailable
    - isActive
    - preparationTime
    - imageUrl
  properties:
    id:
      type: string
      format: uuid
      description: Unique menu item identifier.
      example: 31e9dc29-fd80-5f86-8c09-06b6ee1ef963

    categoryId:
      type: string
      format: uuid
      description: Menu category the item is in.
      example: cf8547b5-aef4-5866-86ac-b39dd6c061cb

    categoryName:
      type: string
      description: Name of that category.
      example: Mains

    name:
      type: string
      maxLength: 150
      description: Item name.
      example: Mixed Grill

    basePrice:
      type: number
      format: double
      minimum: 0
      description: Base price.
      example: 150

    isAvailable:
      type: boolean
      description: Whether customers can order the item right now.
      example: true

    isActive:
      type: boolean
      description: Whether the item is on the menu at all. An inactive item is hidden from customers.
      example: true

    preparationTime:
      type: integer
      nullable: true
      minimum: 0
      description: Preparation time in minutes.
      example: 25

    imageUrl:
      type: string
      format: uri
      nullable: true
      description: First image.
      example: https://cdn.example.com/menu/mixed-grill.jpg

