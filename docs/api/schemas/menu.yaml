      example: Nile Grill House

MenuItem:
  type: object
  required:
    - id
    - name
    - basePrice
    - isAvailable
    - categoryId
    - categoryName
    - restaurantId
    - restaurantName
    - images
    - optionGroups
  properties:
    id:
      type: string
      format: uuid
      description: Unique menu item identifier.
      example: b8c9d0e1-f2a3-4b4c-5d6e-7f8a9b0c1d2e

    name:
      type: string
      description: Menu item name.
      example: Grilled Kofta Platter

    description:
      type: string
      nullable: true
      description: Detailed description of the menu item.
      example: Grilled beef kofta served with rice, grilled vegetables, and tahini salad.

    basePrice:
      type: number
      format: double
      description: Base price of the menu item, before option adjustments.
      example: 150

    isAvailable:
      type: boolean
      description: Whether the item is currently available to order.
      example: true

    preparationTime:
      type: integer
      nullable: true
      description: Estimated preparation time, in minutes.
      example: 20

    categoryId:
      type: string
      format: uuid
      description: Identifier of the category this item belongs to.
      example: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d

    categoryName:
      type: string
      description: Name of the category this item belongs to.
      example: Grills

    restaurantId:
      type: string
      format: uuid
      description: Identifier of the restaurant offering this item.
      example: 4f5e6d7c-8b9a-4c1d-9e2f-3a4b5c6d7e8f

    restaurantName:
      type: string
      description: Name of the restaurant offering this item.
      example: Nile Grill House

    images:
      type: array
      description: Ordered list of image URLs for this item.
      items:
        type: string
        format: uri
      example:
        - https://cdn.example.com/menu-items/kofta-platter/1.jpg
        - https://cdn.example.com/menu-items/kofta-platter/2.jpg

    optionGroups:
      type: array
      description: Customizable option groups available for this item.
      items:
        $ref: "#/MenuItemOptionGroup"

MenuCategory:
  type: object
  required:
    - id
    - name
    - items
  properties:
    id:
      type: string
      format: uuid
      description: Unique category identifier.
      example: a7b8c9d0-e1f2-4a3b-8c9d-0e1f2a3b4c5d

    name:
      type: string
      description: Category name.
      example: Grills

    displayOrder:
      type: integer
      nullable: true
      description: Position of this category within the restaurant's menu.
      example: 1

    items:
      type: array
      items:
        $ref: "#/MenuItemSummary"

