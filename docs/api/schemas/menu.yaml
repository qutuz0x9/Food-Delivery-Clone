OptionValueInput:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      description: Option name. Must be unique within the group.
      example: Large

    priceAdjustment:
      type: number
      format: double
      default: 0
      description: Price change when chosen. May be negative.
      example: 20

    displayOrder:
      type: integer
      nullable: true
      minimum: 0
      description: Position within the group.
      example: 1

CreateOptionGroupRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      description: Group name. Must be unique within the item.
      example: Size

    minSelection:
      type: integer
      minimum: 0
      default: 0
      description: Fewest options the customer must pick (0 or more).
      example: 1

    maxSelection:
      type: integer
      minimum: 1
      default: 1
      description: Most options the customer may pick (at least 1, and not below `minSelection`).
      example: 1

    isRequired:
      type: boolean
      default: false
      description: Whether the customer must choose. A required group needs `minSelection` of at least 1.
      example: true

    values:
      type: array
      description: Options to create with the group.
      items:
        $ref: "#/OptionValueInput"

UpdateOptionGroupRequest:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      description: Group name. Must be unique within the item.
      example: Size

    minSelection:
      type: integer
      minimum: 0
      default: 0
      description: Fewest options the customer must pick (0 or more).
      example: 1

    maxSelection:
      type: integer
      minimum: 1
      default: 1
      description: Most options the customer may pick (at least 1, and not below `minSelection`).
      example: 1

    isRequired:
      type: boolean
      default: false
      description: Whether the customer must choose. A required group needs `minSelection` of at least 1.
      example: true

