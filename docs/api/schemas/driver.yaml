    deliveries:
      type: integer
      minimum: 0
      description: Earnings recorded that day.
      example: 9

    tip:
      type: number
      format: double
      minimum: 0
      description: Tips that day.
      example: 70

    netAmount:
      type: number
      format: double
      minimum: 0
      description: Net amount that day.
