          type: string
          format: date-time
          description: Timestamp the position was stored under.
          example: "2024-10-05T19:05:00.000Z"

DeliveryRequestSummary:
  type: object
  description: A delivery offered to the driver.
  required:
    - id
    - status
    - offeredAt
    - expiresAt
    - orderId
    - orderNumber
    - restaurantName
    - itemCount
    - pickup
    - dropoff
  properties:
    id:
      type: string
      format: uuid
      description: Offer identifier. Use it to accept or reject the request.
      example: 72cd5acb-ce36-5283-89c9-2d75c379d05e

    status:
      type: string
      enum:
        - offered
        - accepted
        - rejected
        - expired
        - withdrawn
      description: State of the offer.
      example: offered

    offeredAt:
      type: string
      format: date-time
      description: When the offer was made.
      example: "2024-10-05T18:32:30.000Z"

    expiresAt:
      type: string
      format: date-time
      description: When the offer stops being valid.
      example: "2024-10-05T18:33:30.000Z"

    orderId:
      type: string
      format: uuid
      description: The order to deliver.
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

    orderNumber:
      type: string
      description: Order number.
      example: ORD-1001

    restaurantName:
      type: string
      description: Restaurant to collect from.
      example: Nile Grill House

    itemCount:
      type: integer
      minimum: 0
      description: Number of items in the order.
      example: 2

    pickup:
      type: object
      required:
        - branchLabel
        - street
        - city
        - latitude
        - longitude
      properties:
        branchLabel:
          type: string
          description: Branch to collect from.
          example: Ramses Branch

        street:
          type: string
          description: Branch street address.
          example: 15 Ramses St

        building:
          type: string
          nullable: true
          description: Building name or number.
          example: Building 4

        city:
          $ref: "./city.yaml#/City"

        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Branch latitude.
          example: 30.0561

        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Branch longitude.
          example: 31.2394

    dropoff:
      type: object
      description: |
        Only the area is shown until the request is accepted. The customer's name, phone and street
        address appear in the delivery details after that.
      required:
        - cityId
        - city
        - latitude
        - longitude
      properties:
        cityId:
          type: string
          format: uuid
          description: City of the delivery address.
          example: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21

        city:
          type: string
          description: City name.
          example: Cairo

        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Delivery point latitude.
          example: 30.0444

        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Delivery point longitude.
          example: 31.2357

DeliveryRequestDetail:
  allOf:
