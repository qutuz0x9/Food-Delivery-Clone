DriverStatistics:
  type: object
  required:
    - period
    - rating
    - totalDeliveries
    - completedDeliveries
    - cancelledDeliveries
    - offers
    - acceptanceRate
  properties:
    period:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date
          nullable: true
          description: Start of the period, if one was given.
          example: "2024-10-01"

        to:
          type: string
          format: date
          nullable: true
          description: End of the period, if one was given.
          example: "2024-10-31"

    rating:
      type: number
      format: double
      nullable: true
      minimum: 0
      maximum: 5
      description: Average review rating (0-5).
      example: 4.8

    totalDeliveries:
      type: integer
      minimum: 0
      description: Completed deliveries over the driver's lifetime.
      example: 312

    completedDeliveries:
      type: integer
      minimum: 0
      description: Deliveries completed in the period.
      example: 48

    cancelledDeliveries:
      type: integer
      minimum: 0
      description: Assignments cancelled in the period.
      example: 1

    offers:
      type: object
      description: Delivery requests offered to the driver in the period.
      required:
        - received
        - accepted
        - rejected
        - expired
      properties:
        received:
          type: integer
          minimum: 0
          example: 60

        accepted:
          type: integer
          minimum: 0
          example: 48

        rejected:
          type: integer
          minimum: 0
          example: 7

        expired:
          type: integer
          minimum: 0
          example: 5

    acceptanceRate:
      type: number
      format: double
      nullable: true
      minimum: 0
      maximum: 1
      description: Accepted offers divided by offers received. Null when there were none.
      example: 0.8

GetDriverStatisticsResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Statistics retrieved successfully

    data:
      type: object
      required:
        - statistics
      properties:
        statistics:
          $ref: "#/DriverStatistics"

DriverReviewView:
  type: object
  required:
    - id
    - orderNumber
    - rating
    - title
    - comment
    - isEdited
    - createdAt
    - publishedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique review identifier.
      example: 05d4f94b-3812-570d-848c-c7db2eeef83f

    orderNumber:
      type: string
      description: Order the review is about.
      example: ORD-1001

    rating:
      type: integer
      minimum: 1
      maximum: 5
      description: Rating from 1 to 5.
      example: 5

    title:
      type: string
      nullable: true
      description: Review title.
      example: Fast and polite

    comment:
      type: string
      nullable: true
      description: Review text.
      example: Arrived early and the food was still hot.

    isEdited:
      type: boolean
      description: Whether the customer edited the review.
      example: false

    createdAt:
      type: string
      format: date-time
      description: When the review was written.
      example: "2024-10-05T20:00:00.000Z"

    publishedAt:
      type: string
      format: date-time
      nullable: true
      description: When the review was published.
      example: "2024-10-05T21:00:00.000Z"

ListDriverReviewsResponse:
  type: object
  required:
