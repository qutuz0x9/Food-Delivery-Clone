PayoutStatus:
  type: string
  enum:
    - pending
    - processing
    - completed
    - failed
    - on_hold
    - cancelled
  description: State of an earning or a payout.
  example: pending

DriverVehicle:
  type: object
  required:
    - id
    - vehicleType
    - brand
    - model
    - color
    - plateNumber
    - manufactureYear
    - insuranceExpiryDate
    - isActive
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique vehicle identifier.
      example: cbc5f999-4a36-5ffc-8f59-e683862a1bb7

    vehicleType:
      type: string
      enum:
        - car
        - motorcycle
        - scooter
        - bicycle
        - van
        - truck
      description: Kind of vehicle.
      example: motorcycle

    brand:
      type: string
      maxLength: 100
      description: Manufacturer.
      example: Honda

    model:
      type: string
      maxLength: 100
      description: Model name.
      example: CB125

    color:
      type: string
      nullable: true
      maxLength: 50
      description: Colour.
      example: Red

    plateNumber:
      type: string
      nullable: true
      maxLength: 30
      description: Registration plate. Unique across all vehicles.
      example: ABC 1234

    manufactureYear:
      type: integer
      nullable: true
      description: Year of manufacture.
      example: 2021

    insuranceExpiryDate:
      type: string
      format: date
      nullable: true
      description: When the insurance expires.
      example: "2025-12-31"

    isActive:
      type: boolean
      description: |
        Whether this is the driver's current vehicle. A driver has at most one active vehicle; inactive
        vehicles are kept as history.
      example: true

    createdAt:
      type: string
      format: date-time
      description: When the vehicle was added.
      example: "2024-01-10T09:00:00.000Z"

VehicleInput:
  type: object
  required:
    - vehicleType
    - brand
    - model
  properties:
    vehicleType:
      type: string
      enum:
        - car
        - motorcycle
        - scooter
        - bicycle
        - van
        - truck
      description: Kind of vehicle.
      example: motorcycle

    brand:
      type: string
      minLength: 1
      maxLength: 100
      description: Manufacturer.
      example: Honda

    model:
      type: string
      minLength: 1
      maxLength: 100
      description: Model name.
      example: CB125

    color:
      type: string
      nullable: true
      maxLength: 50
      description: Colour.
      example: Red

    plateNumber:
      type: string
      nullable: true
      maxLength: 30
      description: Registration plate. Must be unique across all vehicles.
      example: ABC 1234

    manufactureYear:
      type: integer
      nullable: true
      description: Year of manufacture.
      example: 2021

    insuranceExpiryDate:
      type: string
      format: date
      nullable: true
      description: When the insurance expires.
      example: "2025-12-31"

DriverDocument:
  type: object
  required:
    - id
    - documentType
    - fileUrl
    - status
    - expiryDate
    - verifiedAt
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique document identifier.
      example: 75488f9f-8635-539a-9d05-8e7c88db41e1

    documentType:
      type: string
      enum:
        - driver_license
        - national_id
        - passport
        - insurance
        - vehicle_registration
        - background_check
        - medical_certificate
        - other
      description: Kind of document.
      example: driver_license

    fileUrl:
      type: string
      format: uri
      description: Where the uploaded file is stored.
      example: https://cdn.example.com/drivers/omar/license.jpg

    status:
      type: string
      enum:
        - pending
        - submitted
        - verified
        - rejected
        - expired
      description: Review state of the document.
      example: verified

    expiryDate:
      type: string
      format: date
      nullable: true
      description: When the document expires.
      example: "2027-08-30"

    verifiedAt:
      type: string
      format: date-time
      nullable: true
      description: When an administrator verified it.
      example: "2024-01-12T11:00:00.000Z"

    createdAt:
      type: string
      format: date-time
      description: When the document was uploaded.
      example: "2024-01-10T09:05:00.000Z"

DriverProfile:
  type: object
  required:
    - id
    - firstName
    - lastName
    - email
    - phoneNumber
    - dateOfBirth
    - profileImageUrl
    - nationalId
    - licenseNumber
    - licenseExpiryDate
    - workingCity
    - status
    - availabilityStatus
    - rating
    - totalDeliveries
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique driver identifier.
      example: e035c191-7d58-52be-9f78-c9a9351192dd

    firstName:
      type: string
      maxLength: 100
      description: First name.
      example: Omar

    lastName:
      type: string
      maxLength: 100
      description: Last name.
      example: Hassan

    email:
      type: string
      format: email
      description: Login email of the driver's user account.
      example: omar.hassan@example.com

    phoneNumber:
      type: string
      description: Phone number of the driver's user account.
      example: "+201001234567"

    dateOfBirth:
      type: string
      format: date
      description: Date of birth.
      example: "1992-04-18"

    profileImageUrl:
      type: string
      format: uri
      nullable: true
      description: Profile picture.
      example: https://cdn.example.com/drivers/omar/profile.jpg

    nationalId:
      type: string
      maxLength: 30
      description: National identity number. Unique across drivers.
      example: "29204180101234"

    licenseNumber:
      type: string
      maxLength: 50
      description: Driving licence number. Unique across drivers.
      example: LIC-559213

    licenseExpiryDate:
      type: string
      format: date
      description: When the licence expires.
      example: "2027-08-30"

    workingCity:
      $ref: "./city.yaml#/City"

    status:
      type: string
      enum:
        - pending
        - active
        - inactive
      description: Approval state set by an administrator. Only `active` drivers can receive deliveries.
      example: active

    availabilityStatus:
      type: string
      enum:
        - available
        - busy
        - offline
        - on_break
      description: Whether the driver is taking deliveries right now.
      example: available

    rating:
      type: number
      format: double
      minimum: 0
      maximum: 5
      description: Average review rating (0-5), a cached value.
      example: 4.8

    totalDeliveries:
      type: integer
      minimum: 0
      description: Completed deliveries, a cached value.
      example: 312

    vehicle:
      type: object
      nullable: true
      description: The driver's active vehicle.
      allOf:
        - $ref: "#/DriverVehicle"

    createdAt:
      type: string
      format: date-time
      description: When the account was created.
      example: "2024-01-10T09:00:00.000Z"

    updatedAt:
      type: string
      format: date-time
      nullable: true
      description: Last profile change.
      example: "2024-02-01T09:00:00.000Z"

RegisterDriverRequest:
  type: object
  required:
    - email
    - password
    - phoneNumber
    - firstName
    - lastName
    - dateOfBirth
    - nationalId
    - licenseNumber
    - licenseExpiryDate
    - workingCityId
    - vehicle
  properties:
    email:
      type: string
      format: email
      description: Login email. Must be unique across all accounts.
      example: omar.hassan@example.com

    password:
      type: string
      format: password
      minLength: 8
      description: Account password.
      example: StrongPassword123!

    phoneNumber:
      type: string
      description: Phone number. Must be unique across all accounts.
      example: "+201001234567"

    firstName:
      type: string
      minLength: 1
      maxLength: 100
      description: First name.
      example: Omar

    lastName:
      type: string
      minLength: 1
      maxLength: 100
      description: Last name.
      example: Hassan

    dateOfBirth:
      type: string
      format: date
      description: Date of birth.
      example: "1992-04-18"

    nationalId:
      type: string
      maxLength: 30
      description: National identity number. Must be unique across drivers.
      example: "29204180101234"

    licenseNumber:
      type: string
      maxLength: 50
      description: Driving licence number. Must be unique across drivers.
      example: LIC-559213

    licenseExpiryDate:
      type: string
      format: date
      description: When the licence expires.
      example: "2027-08-30"

    workingCityId:
      type: string
      format: uuid
      description: The one city the driver serves, from `GET /cities`.
      example: 5e2a9c14-7b3d-4f68-8a01-9c4d6e8f0b21

    vehicle:
      $ref: "#/VehicleInput"

RegisterDriverResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Driver account created successfully. It is now pending approval.

    data:
      type: object
      required:
        - driver
      properties:
        driver:
          $ref: "#/DriverProfile"

LoginDriverRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: Account email.
      example: omar.hassan@example.com

    password:
      type: string
      format: password
      description: Account password.
      example: StrongPassword123!

LoginDriverResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Logged in successfully

    data:
      type: object
      required:
        - driver
        - accessToken
      properties:
        driver:
          $ref: "#/DriverProfile"

        accessToken:
          type: string
          description: JWT access token used to authenticate subsequent requests.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

RefreshDriverResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Access token refreshed successfully

    data:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: New JWT access token. The rotated refresh token is sent only in the `Set-Cookie` header.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3ZDhjNWU5YSJ9.xyz789signature

LogoutDriverResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Logged out successfully

    data:
      type: object
      nullable: true

ForgotPasswordDriverRequest:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      format: email
      description: Email of the account to recover.
      example: omar.hassan@example.com

ForgotPasswordDriverResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: If an account with that email exists, a password reset link has been sent.

    data:
      type: object
      nullable: true

ResetPasswordDriverRequest:
  type: object
  required:
    - token
    - newPassword
    - confirmPassword
  properties:
    token:
      type: string
      description: Password reset token received via email.
      example: 9f8e7d6c-5b4a-3c2d-1e0f-a1b2c3d4e5f6

    newPassword:
      type: string
      format: password
      minLength: 8
      description: New account password.
      example: NewStrongPassword123!

    confirmPassword:
      type: string
      format: password
      minLength: 8
      description: Must match `newPassword` exactly.
      example: NewStrongPassword123!

ResetPasswordDriverResponse:
  type: object
