      type: number
      format: double
      minimum: -90
      maximum: 90
      description: Current latitude.
      example: 30.0561

    longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
      description: Current longitude.
      example: 31.2394

    heading:
