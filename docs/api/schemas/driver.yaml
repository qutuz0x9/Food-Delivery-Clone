Payout:
  type: object
  required:
    - id
    - periodStart
    - periodEnd
    - amount
    - status
    - paidAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique payout identifier.
      example: 96ccc283-c80a-50f4-aa26-931dc0f37dbf

    periodStart:
      type: string
      format: date
      description: First day the payout covers.
      example: "2024-09-29"

    periodEnd:
      type: string
      format: date
      description: Last day the payout covers.
      example: "2024-10-05"

    amount:
      type: number
      format: double
      minimum: 0
      description: Total paid out.
      example: 1450

    status:
      $ref: "#/PayoutStatus"

    paidAt:
      type: string
      format: date-time
      nullable: true
      description: When the payout was made.
      example: "2024-10-07T10:00:00.000Z"

ListPayoutsResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Payouts retrieved successfully

    data:
      type: object
      required:
        - payouts
        - pagination
      properties:
        payouts:
          type: array
          items:
