DeliverySummary:
  type: object
  required:
    - id
    - orderId
    - orderNumber
    - orderStatus
    - status
    - restaurantName
    - branchLabel
    - dropoffCity
    - assignedAt
    - acceptedAt
    - completedAt
  properties:
    id:
      type: string
      format: uuid
      description: Assignment identifier, used in the delivery endpoints.
      example: a7b7de55-5c91-5d15-b152-a7f6c258fe30

    orderId:
      type: string
      format: uuid
      description: The order being delivered.
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

    orderNumber:
      type: string
      description: Order number.
      example: ORD-1001

    orderStatus:
      $ref: "./order.yaml#/OrderStatus"

    status:
      type: string
      enum:
        - pending
        - accepted
        - rejected
        - completed
        - cancelled
      description: State of the driver's assignment.
      example: accepted

    restaurantName:
      type: string
      description: Restaurant to collect from.
      example: Nile Grill House

    branchLabel:
      type: string
      description: Branch to collect from.
      example: Ramses Branch

    dropoffCity:
      type: string
      description: City the order is delivered to.
      example: Cairo

    assignedAt:
      type: string
      format: date-time
      description: When the assignment was created.
      example: "2024-10-05T18:33:00.000Z"

    acceptedAt:
      type: string
      format: date-time
      nullable: true
      description: When the driver accepted.
      example: "2024-10-05T18:33:00.000Z"

    completedAt:
      type: string
      format: date-time
      nullable: true
      description: When the delivery was completed.
      example: null

DeliveryDetail:
  allOf:
    - $ref: "#/DeliverySummary"
    - type: object
      required:
        - pickup
        - dropoff
        - items
      properties:
        pickup:
          $ref: "./order.yaml#/OrderBranch"

        dropoff:
          $ref: "./order.yaml#/OrderAddress"

        items:
          type: array
          items:
            $ref: "./order.yaml#/OrderItem"

        customerNote:
          type: string
          nullable: true
          description: Note from the customer for the whole order.
          example: Please ring the bell

        payment:
          type: object
          nullable: true
          description: Payment for the order. For `cash` the driver collects `amount` from the customer.
          allOf:
            - $ref: "./payment.yaml#/PaymentSummary"

ListDeliveriesResponse:
  type: object
  required:
