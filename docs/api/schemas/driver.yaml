Earning:
  type: object
  required:
    - id
    - orderId
    - orderNumber
    - baseFee
    - bonus
    - tip
    - deduction
    - netAmount
    - status
    - payoutId
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique earning identifier.
      example: e5e31669-fa69-5b42-8ddb-c31707eb989c

    orderId:
      type: string
      format: uuid
      description: Delivered order the earning is for.
      example: 9c5c9d42-4b36-52e7-b4d4-c9e4d980f49b

    orderNumber:
      type: string
      description: Order number.
      example: ORD-1001

    baseFee:
      type: number
      format: double
      minimum: 0
      description: Base delivery fee.
      example: 30

    bonus:
      type: number
      format: double
      minimum: 0
      description: Bonus.
      example: 5

    tip:
      type: number
      format: double
      minimum: 0
      description: Tip from the customer.
      example: 10

    deduction:
      type: number
      format: double
      minimum: 0
      description: Deductions.
      example: 0

    netAmount:
      type: number
      format: double
      minimum: 0
      description: Base fee + bonus + tip − deduction.
      example: 45

    status:
      $ref: "#/PayoutStatus"

    payoutId:
      type: string
      format: uuid
      nullable: true
      description: Payout that paid this earning, once it is settled.
      example: 96ccc283-c80a-50f4-aa26-931dc0f37dbf

    createdAt:
      type: string
      format: date-time
      description: When the earning was recorded.
      example: "2024-10-05T19:20:00.000Z"

ListEarningsResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Earnings retrieved successfully

    data:
      type: object
      required:
        - earnings
        - pagination
      properties:
        earnings:
          type: array
          items:
            $ref: "#/Earning"

        pagination:
          $ref: "./common.yaml#/PaginationMeta"

EarningsSummary:
  type: object
  required:
    - periodStart
    - periodEnd
    - deliveries
    - baseFee
    - bonus
    - tip
    - deduction
    - netAmount
    - byStatus
  properties:
    periodStart:
      type: string
      format: date
      description: First day of the period.
      example: "2024-10-01"

    periodEnd:
      type: string
      format: date
      description: Last day of the period.
      example: "2024-10-31"

    deliveries:
      type: integer
      minimum: 0
      description: Earnings recorded in the period.
      example: 48

    baseFee:
      type: number
      format: double
      minimum: 0
      description: Total base fees.
      example: 1440

    bonus:
      type: number
      format: double
      minimum: 0
      description: Total bonuses.
      example: 120

    tip:
      type: number
      format: double
      minimum: 0
      description: Total tips.
      example: 360

    deduction:
      type: number
      format: double
      minimum: 0
      description: Total deductions.
      example: 20

    netAmount:
      type: number
      format: double
      minimum: 0
      description: Total net amount.
      example: 1900

    byStatus:
      type: object
      description: Net amount per status, so the driver can see what is still unpaid.
      required:
        - pending
        - processing
        - completed
        - failed
        - on_hold
        - cancelled
      properties:
        pending:
          type: number
          format: double
          minimum: 0
          example: 450

        processing:
          type: number
          format: double
          minimum: 0
          example: 0

        completed:
          type: number
          format: double
          minimum: 0
          example: 1450

        failed:
          type: number
          format: double
          minimum: 0
          example: 0

        on_hold:
          type: number
          format: double
          minimum: 0
          example: 0

        cancelled:
          type: number
          format: double
          minimum: 0
          example: 0

GetEarningsSummaryResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Earnings summary retrieved successfully

    data:
      type: object
      required:
        - summary
      properties:
        summary:
          $ref: "#/EarningsSummary"

