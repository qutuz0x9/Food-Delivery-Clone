Promotion:
  type: object
  required:
    - id
    - title
    - discountType
    - discountValue
    - startsAt
    - endsAt
    - isActive
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique promotion identifier.
      example: 160557b7-0592-52c8-b120-702b9ba6b194

    title:
      type: string
      description: Promotion title shown to customers.
      example: 20% off orders over 200 EGP

    discountType:
      type: string
      enum:
        - percentage
        - fixed
        - free_shipping
        - buy_one_get_one
      description: Kind of discount.
      example: percentage

    discountValue:
      type: number
      format: double
      minimum: 0
      description: |
        Percentage (0-100) for `percentage`, an amount for `fixed`. Not used by `free_shipping` and
        `buy_one_get_one`.
      example: 20

    startsAt:
      type: string
      format: date-time
      description: When the promotion starts.
      example: "2024-06-01T00:00:00.000Z"

    endsAt:
      type: string
      format: date-time
      description: When the promotion ends. Always after `startsAt`.
      example: "2024-06-30T23:59:59.000Z"

    isActive:
      type: boolean
      description: |
        Whether the promotion is switched on. It applies only while active and between `startsAt` and
        `endsAt`.
      example: true

    createdAt:
      type: string
      format: date-time
      description: When the promotion was created.
      example: "2024-05-20T10:00:00.000Z"

    updatedAt:
      type: string
      format: date-time
      nullable: true
      description: Last change.
      example: null

CreatePromotionRequest:
  type: object
  required:
    - title
    - discountType
    - discountValue
    - startsAt
    - endsAt
  properties:
    title:
      type: string
      minLength: 1
      description: Promotion title.
      example: 20% off orders over 200 EGP

    discountType:
      type: string
      enum:
        - percentage
        - fixed
        - free_shipping
        - buy_one_get_one
      description: Kind of discount.
      example: percentage

    discountValue:
      type: number
      format: double
      minimum: 0
      description: |
        Percentage (0-100) for `percentage`, an amount for `fixed`. Send 0 for `free_shipping` and
        `buy_one_get_one`.
      example: 20

    startsAt:
      type: string
      format: date-time
      description: When the promotion starts.
      example: "2024-06-01T00:00:00.000Z"

    endsAt:
      type: string
      format: date-time
      description: When the promotion ends. Must be after `startsAt`.
      example: "2024-06-30T23:59:59.000Z"

    isActive:
      type: boolean
      default: true
      description: Whether the promotion is switched on.
      example: true

UpdatePromotionRequest:
  type: object
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 1
      description: Promotion title.
      example: 20% off orders over 200 EGP

    discountType:
      type: string
      enum:
        - percentage
        - fixed
        - free_shipping
        - buy_one_get_one
      description: Kind of discount.
      example: percentage

    discountValue:
      type: number
      format: double
      minimum: 0
      description: |
        Percentage (0-100) for `percentage`, an amount for `fixed`. Send 0 for `free_shipping` and
        `buy_one_get_one`.
      example: 20

    startsAt:
      type: string
      format: date-time
      description: When the promotion starts.
      example: "2024-06-01T00:00:00.000Z"

    endsAt:
      type: string
      format: date-time
      description: When the promotion ends. Must be after `startsAt`.
      example: "2024-06-30T23:59:59.000Z"

    isActive:
      type: boolean
      description: Switch the promotion on or off.
      example: false

ListPromotionsResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
      example: true

    message:
      type: string
      example: Promotions retrieved successfully

    data:
      type: object
      required:
        - promotions
        - pagination
      properties:
        promotions:
          type: array
          items:
            $ref: "#/Promotion"

        pagination:
          $ref: "./common.yaml#/PaginationMeta"

