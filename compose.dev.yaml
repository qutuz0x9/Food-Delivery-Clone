# Dev only: hot reload from your working tree, database port open for psql, and pgAdmin to browse the data.
services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:5432"

  api:
    build:
      target: dev
    volumes:
      - ./src:/app/src
      - ./docs/api:/app/docs/api

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin-data:
