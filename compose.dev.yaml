# Dev only: hot reload from your working tree, database port open for psql, and pgAdmin to browse the data.
services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:5432"

  api:
    build:
      target: dev
    # Same as `npm run dev`, plus Node's debugger on 9229 for VS Code to attach to (.vscode/launch.json).
    # The flag is on tsx only: NODE_OPTIONS would give it to npm and nodemon too, and they'd take the port first.
    command: ["npx", "nodemon", "--exec", "tsx --inspect=0.0.0.0:9229 ./src/index.ts"]
    ports:
      # 127.0.0.1 only: whoever reaches the debugger can run any code in the app.
      - "127.0.0.1:9229:9229"
    volumes:
      - ./src:/app/src
      - ./docs/api:/app/docs/api

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin-data:
